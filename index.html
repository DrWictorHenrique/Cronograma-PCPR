<script>
(function(){
  if (window.storage && typeof window.storage.get === "function") return;
  var mem={}, has=(function(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}})();
  window.storage={
    get:async k=>{var v=has?localStorage.getItem(k):(k in mem?mem[k]:null);return v==null?null:{key:k,value:v,shared:false}},
    set:async(k,v)=>{has?localStorage.setItem(k,v):mem[k]=v;return{key:k,value:v,shared:false}},
    delete:async k=>{has?localStorage.removeItem(k):delete mem[k];return{key:k,deleted:true,shared:false}},
    list:async p=>{var ks=[];if(has){for(var i=0;i<localStorage.length;i++){var kk=localStorage.key(i);if(!p||kk.indexOf(p)===0)ks.push(kk)}}else{for(var m in mem)if(!p||m.indexOf(p)===0)ks.push(m)}return{keys:ks,prefix:p,shared:false}}
  };
})();

<style>

/* ---------- utilidades ---------- */
const d2s=d=>d.toISOString().slice(0,10);
const s2d=s=>{const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd,12,0,0)};
const addD=(s,n)=>{const d=s2d(s);d.setDate(d.getDate()+n);return d2s(d)};
const WD=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const fmt=s=>{const d=s2d(s);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")};
function today(){const n=new Date();const t=d2s(new Date(n.getFullYear(),n.getMonth(),n.getDate(),12));return t<START?START:t}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function safeUrl(u){u=String(u||"").replace(/[\s\u200b]+/g,"").trim();return /^(https?:|\.\/|\/|[\w\-.]+\/)/i.test(u)?u:""}

/* ---------- geração ---------- */
function take(q,day){for(let i=0;i<q.length;i++){if(!q[i].a||q[i].a<=day)return q.splice(i,1)[0]}return null}
function generate(){
  const queues={},dr={},plan={};
  for(const d in BANK)queues[d]=BANK[d].map(x=>Object.assign({disc:d},x));
  for(const d in DRILL)dr[d]=0;
  let cur=START;
  while(cur<=PHASE1_END){
    const wd=s2d(cur).getDay(),slots=TEMPLATE[wd],ts=TIMES[wd];plan[cur]=[];
    slots.forEach((d,i)=>{
      if(d==="ERR"){plan[cur].push({id:"E."+cur,disc:"REV",tp:"rev",t:"Caderno de erros: registrar e refazer os erros do dia",src:"",min:30,date:cur,time:ts[i]});return}
      if(d==="REV"){const r=REV_DAYS[cur];if(r)plan[cur].push({id:"R."+cur,disc:"REV",tp:r.min>=300?"sim":"rev",t:r.t,src:"",min:r.min,date:cur,time:ts[i]});return}
      const it=take(queues[d],cur);
      if(it)plan[cur].push({id:d+"."+it.k,disc:d,tp:it.tp,t:it.t,src:it.src,min:50,date:cur,time:ts[i]});
      else if(DRILL[d]){const n=dr[d]++;plan[cur].push({id:d+".x"+n,disc:d,tp:"rev",t:DRILL[d][n%DRILL[d].length],src:"Reforço e volume de questões",min:50,date:cur,time:ts[i]})}
    });
    cur=addD(cur,1);
  }
  const sobra=[];
  for(const d in queues)queues[d].forEach(it=>sobra.push({id:d+"."+it.k,disc:d,tp:it.tp,t:it.t,src:it.src,min:50}));
  for(const day in RETA)plan[day]=RETA[day].map((b,i)=>({id:"F."+day+"."+i,disc:b[0],tp:b[1],t:b[2],src:"",min:b[3],time:b[4],date:day}));
  return{plan:plan,sobra:sobra};
}

function tasksByDay(){
  const map={};
  for(const day in PLAN)PLAN[day].forEach(t=>{
    if(STATE.removed[t.id])return;const d=STATE.moved[t.id]||t.date;
    (map[d]=map[d]||[]).push(Object.assign({},t,{date:d,t:STATE.edited[t.id]||t.t}));
  });
  for(const day in STATE.custom)STATE.custom[day].forEach(t=>{
    if(STATE.removed[t.id])return;const d=STATE.moved[t.id]||day;
    (map[d]=map[d]||[]).push(Object.assign({},t,{date:d,t:STATE.edited[t.id]||t.t}));
  });
  for(const d in map)map[d].sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  return map;
}

/* ---------- desempenho ---------- */
function accColor(a){return a>=.75?"#2E6B4F":a>=.6?"#9A7A18":a>=.45?"#B8631F":"#A32B21"}
function discAcc(logs){const by={};logs.forEach(l=>{(by[l.disc]=by[l.disc]||[]).push(l)});const o={};
  for(const d in by){const last=by[d].slice(-4),h=last.reduce((a,l)=>a+l.hit,0),t=last.reduce((a,l)=>a+l.tot,0);if(t>0)o[d]={a:h/t,h:h,t:t,n:by[d].length}}return o}
function projected(logs){const acc=discAcc(logs),H=logs.reduce((a,l)=>a+l.hit,0),T=logs.reduce((a,l)=>a+l.tot,0),base=T>0?H/T:0;
  let s=0,known=0;for(const k in DISC){if(!DISC[k].q)continue;if(acc[k]){s+=DISC[k].q*acc[k].a;known+=DISC[k].q}else s+=DISC[k].q*base}
  return{score:s,known:known,geral:base,H:H,T:T,acc:acc}}
function timeline(){const ls=STATE.logs.slice().sort((a,b)=>a.d.localeCompare(b.d)),ds=[...new Set(ls.map(l=>l.d))];
  return ds.map(d=>({d:d,v:projected(ls.filter(l=>l.d<=d)).score}))}
function lineChart(pts){
  if(!pts.length)return '<div class="empty">Registre ao menos uma bateria de questões para o gráfico aparecer.</div>';
  const W=640,H=210,L=32,R=10,T=14,B=24,iw=W-L-R,ih=H-T-B,n=pts.length;
  const x=i=>L+(n===1?iw/2:iw*i/(n-1)),y=v=>T+ih-(ih*Math.max(0,Math.min(100,v))/100);
  let d="";pts.forEach((p,i)=>{d+=(i?" L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)});
  const area="M"+x(0).toFixed(1)+" "+(T+ih)+" L"+d.slice(1)+" L"+x(n-1).toFixed(1)+" "+(T+ih)+" Z";
  let g="";[0,25,50,75,100].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(v===50?"#A32B21":"#E1E3DD")+'" stroke-width="1"'+(v===50?' stroke-dasharray="4 3"':'')+'/><text class="axis" x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>'});
  let dots="";pts.forEach((p,i)=>{dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3.2" fill="#0F1418"/>'});
  let lab="";[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i&&v>=0).forEach(i=>{lab+='<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+fmt(pts[i].d)+'</text>'});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução da nota projetada">'+g+'<path d="'+area+'" fill="rgba(31,78,95,.10)"/><path d="'+d+'" fill="none" stroke="#1F4E5F" stroke-width="2.2" stroke-linejoin="round"/>'+dots+lab+'<text class="axis" x="'+(W-R)+'" y="'+(y(pts[n-1].v)-9)+'" text-anchor="end" style="fill:#0F1418;font-weight:700">'+pts[n-1].v.toFixed(0)+' pts</text></svg>';
}

function render(){
  const map=tasksByDay(),tod=today(),dleft=Math.round((s2d(EXAM)-s2d(tod))/864e5);
  let doneAll=0,totAll=0;const per={};
  for(const day in map)map[day].forEach(t=>{if(t.disc==="REV")return;
    per[t.disc]=per[t.disc]||{d:0,t:0};per[t.disc].t++;totAll++;if(STATE.done[t.id]){per[t.disc].d++;doneAll++}});
  const P=projected(STATE.logs),cls=P.T===0?"":(P.score>=70?"good":P.score>=50?"mid":"bad");
  let cells="",legend="";
  for(const k in DISC){if(!DISC[k].q)continue;
    const p=per[k]?per[k].d/Math.max(per[k].t,1):0,f=Math.round(DISC[k].q*p);

function viewPlano(map,tod){
  let html=topCard(map,tod)+barHtml();
  let body="",lp="",ALT=0;
  Object.keys(map).sort().forEach(day=>{
    if(day<START)return;
    const l=map[day].filter(t=>FILTER==="all"||t.disc===FILTER).filter(t=>!ONLYOPEN||!STATE.done[t.id]);
    const ph=day<="2026-09-07"?"F1":(day<="2026-09-29"?"F2":"F3");
    if(ph!==lp){lp=ph;const m={F1:["Fase 1 · 10/08 a 07/09 — Construção","Primeira passada nas aulas de maior peso"],F2:["Fase 2 · 08/09 a 29/09 — Consolidação","2ª passada + volume de questões e Rodadas Avançadas"],F3:["Fase 3 · 30/09 a 11/10 — Reta final","Só revisão, lei seca e simulado"]}[ph];
      body+='<div class="phase"><h2>'+m[0]+'</h2><p>'+m[1]+'</p></div>'}
    if(!l.length&&(FILTER!=="all"||ONLYOPEN))return;
    const mins=l.reduce((a,t)=>a+t.min,0),d2=l.filter(t=>STATE.done[t.id]).length,p2=l.length?Math.round(100*d2/l.length):0,col=STATE.collapsed[day],wd=s2d(day).getDay();
    body+='<div class="day '+(ALT++%2?"b":"a")+(day===tod?" today":"")+(day<tod?" past":"")+(day===EXAM?" exam":"")+(p2===100&&l.length?" full":"")+'"><div class="day-h" data-toggle="'+day+'"><span class="day-d">'+fmt(day)+'</span><span class="day-w">'+WD[wd]+'</span>';
    if(day<=PHASE1_END)body+='<span class="win">'+JANELA[wd]+'</span>';
    if(day===tod)body+='<span class="tag">hoje</span>';
    body+='<span class="day-m"><span class="mini"><i style="width:'+p2+'%"></i></span>'+d2+'/'+l.length+' · '+(mins/60).toFixed(1).replace(".",",")+'h '+(col?"▸":"▾")+'</span></div>';
    if(!col){body+='<div class="day-b">';l.forEach(t=>{body+=taskHtml(t)});body+='<button class="add" data-add="'+day+'">+ acrescentar bloco neste dia</button></div>'}
    body+='</div>';
  });
  return html+body;
}


/* ---------- visão semanal ---------- */
const W0="2026-08-09";
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DSIG=["dom","seg","ter","qua","qui","sex","sáb"];
const TIPO={aula:"Aula",quest:"Tarefa",sim:"Simulado",gap:"Material",rev:"Revisão"};
function weekOf(d){return Math.floor((s2d(d)-s2d(W0))/6048e5)}
function weekStart(i){return addD(W0,i*7)}
const WMAX=weekOf(EXAM);

function miniCal(wi,map){
  const ws=weekStart(wi),mid=s2d(addD(ws,3)),y=mid.getFullYear(),m=mid.getMonth(),tod=today();
  const first=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();
  let g="";DSIG.forEach(d=>g+='<span>'+d.charAt(0).toUpperCase()+'</span>');
  for(let i=0;i<first;i++)g+='<button class="off" disabled></button>';
  for(let d=1;d<=nd;d++){
    const iso=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const inw=iso>=ws&&iso<=addD(ws,6),has=!!map[iso];
    g+='<button class="'+(iso===tod?"tod":inw?"wk":has?"":"off")+'" '+(has?'data-goday="'+iso+'"':'disabled')+'>'+d+'</button>';
  }
  return '<div class="cal"><div class="wk-nav" style="justify-content:center"><button class="nav-btn" id="wkPrev"'+(wi<=0?" disabled":"")+'>‹</button>'+
   '<b>Semana '+(wi+1)+'</b><button class="nav-btn" id="wkNext"'+(wi>=WMAX?" disabled":"")+'>›</button></div>'+
   '<div class="cal-m">'+MES[m]+'</div><div class="cal-g">'+g+'</div></div>';
}

function actHtml(t,day){
  const done=!!STATE.done[t.id],lk=STATE.links[t.id],u=lk?safeUrl(lk.url):"";
  let h='<div class="act'+(done?" dn":"")+'" style="border-left-color:'+DISC[t.disc].c+'">';
  h+='<div class="ab"><span class="al">'+esc(TIPO[t.tp]||"Aula")+' · '+esc(t.time||"")+'</span>';
  h+=u?'<a class="at" href="'+esc(u)+'" target="_blank" rel="noopener" title="Abrir o material desta aula">'+esc(t.t)+'</a>'
      :'<div class="at">'+esc(t.t)+'</div>';
  h+='<span class="as">'+t.min+'min · '+esc(DISC[t.disc].n)+(t.src?" · "+esc(t.src):"")+'</span>';
  if(u)h+='<a class="mlink" href="'+esc(u)+'" target="_blank" rel="noopener">📄 <span>'+esc(lk.label||"abrir material")+'</span></a>';
  h+='</div><div class="ax"><div class="chk'+(done?" done":"")+'" data-done="'+t.id+'" role="checkbox" tabindex="0" aria-checked="'+done+'"></div>';
  h+='<button class="ico" style="padding:2px 3px;font-size:11px" data-log="'+t.id+'" data-disc="'+t.disc+'" data-day="'+day+'" title="Registrar acertos">◎</button></div></div>';
  return h;
}

function viewSemana(map,tod){
  if(WEEK===null)WEEK=Math.max(0,Math.min(weekOf(tod),WMAX));
  const ws=weekStart(WEEK);
  let cards=miniCal(WEEK,map);
  for(let i=0;i<7;i++){
    const day=addD(ws,i);
    if(day<START||day>EXAM){continue}
    const l=(map[day]||[]).filter(t=>FILTER==="all"||t.disc===FILTER).filter(t=>!ONLYOPEN||!STATE.done[t.id]);
    const mins=l.reduce((a,t)=>a+t.min,0),pend=l.filter(t=>!STATE.done[t.id]).length;
    cards+='<div class="dcard '+(i%2?"b":"a")+(day===tod?" tod":"")+(day<tod?" pst":"")+(l.length&&!pend?" ok":"")+'">';
    cards+='<div class="dcard-h"><div><span class="dt">'+DSIG[s2d(day).getDay()]+' · '+fmt(day)+'</span>'+
      '<span class="mt">'+(mins>=60?Math.floor(mins/60)+"h"+(mins%60?String(mins%60).padStart(2,"0"):"m"):mins+"m")+' · '+l.length+' atividade'+(l.length===1?"":"s")+'</span></div>'+
      '<span class="badge'+(pend?"":" z")+'">'+(pend||"✓")+'</span></div>';
    cards+='<div class="dcard-b">'+l.map(t=>actHtml(t,day)).join("")+'</div></div>';
  }
  return topCard(map,tod)+barHtml()+'<div class="wk-grid">'+cards+'</div>';
}

function bind(){

  $$("[data-done]").forEach(el=>{const f=()=>{const id=el.dataset.done;STATE.done[id]?delete STATE.done[id]:STATE.done[id]=1;save();render()};
    el.onclick=f;el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();f()}}});
  $$("[data-toggle]").forEach(el=>el.onclick=e=>{if(e.target.closest("button"))return;
    const d=el.dataset.toggle;STATE.collapsed[d]?delete STATE.collapsed[d]:STATE.collapsed[d]=1;save();render()});
  $$("[data-edit]").forEach(el=>el.onclick=()=>{const id=el.dataset.edit,cur=el.closest(".task").querySelector(".t-title").textContent;
    openModal({title:"Editar bloco",fields:[{label:"Descrição",value:cur}],onSave:v=>{if(v[0].trim())STATE.edited[id]=v[0].trim()}})});
  $$("[data-rm]").forEach(el=>el.onclick=()=>{STATE.removed[el.dataset.rm]=1;save();render()});
  $$("[data-push]").forEach(el=>el.onclick=()=>{const id=el.dataset.push,cur=el.closest(".day").querySelector(".day-h").dataset.toggle;
    STATE.moved[id]=addD(cur,1);save();render()});
  $$("[data-log]").forEach(el=>el.onclick=()=>{const id=el.dataset.log,disc=el.dataset.disc,day=el.closest(".day").querySelector(".day-h").dataset.toggle;
    logModal(id,DISC[disc]&&DISC[disc].q?disc:"TI",day)});
  if($("#newlog"))$("#newlog").onclick=()=>logModal(null,"TI",today());
  $$("[data-link]").forEach(el=>el.onclick=()=>{const id=el.dataset.link;linkModal(id,STATE.links[id]||{},el.closest(".task").querySelector(".t-title").textContent)});
  $$("[data-linkkey]").forEach(el=>el.onclick=()=>{const k=el.dataset.linkkey;linkModal(k,STATE.links[k]||{},el.closest(".mrow").querySelector(".mt").childNodes[0].textContent)});
  $$("[data-add]").forEach(el=>el.onclick=()=>{const day=el.dataset.add;
    openModal({title:"Novo bloco",fields:[{label:"O que estudar",value:"",ph:"Ex.: refazer erros de Excel"},
      {label:"Matéria",type:"select",value:"TI",options:Object.keys(DISC).map(k=>[k,DISC[k].n])},
      {label:"Tipo",type:"select",value:"quest",options:[["aula","Aula"],["quest","Questões"],["sim","Simulado"],["rev","Revisão"]]},
      {label:"Horário",value:"20:30"},{label:"Duração (min)",type:"number",value:"50"}],
      onSave:v=>{if(!v[0].trim())return;STATE.custom[day]=STATE.custom[day]||[];
        STATE.custom[day].push({id:"C."+Date.now(),disc:DISC[v[1]]?v[1]:"REV",tp:v[2],t:v[0].trim(),src:"Bloco criado por você",min:+v[4]||50,time:v[3]})}})});
  $$("a[href]").forEach(el=>{
    if(el.dataset.ab)return; el.dataset.ab="1";
    el.addEventListener("click",function(e){
      if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
      const u=el.getAttribute("href");
      if(!u||u.charAt(0)==="#")return;
      e.preventDefault();
      let w=null;
      try{w=window.open(u,"_blank","noopener")}catch(_){}
      if(!w){
        try{ if(window.top!==window.self){window.top.location.href=u;return} }catch(_){}
        window.location.href=u;
      }
    });
  });
  if($("#vwS"))$("#vwS").onclick=()=>{VIEW="semana";STATE.view=VIEW;save();render()};
  if($("#vwL"))$("#vwL").onclick=()=>{VIEW="lista";STATE.view=VIEW;save();render()};
  if($("#wkPrev"))$("#wkPrev").onclick=()=>{WEEK=Math.max(0,WEEK-1);render()};
  if($("#wkNext"))$("#wkNext").onclick=()=>{WEEK=Math.min(WMAX,WEEK+1);render()};
  if($("#wkNow"))$("#wkNow").onclick=()=>{WEEK=Math.max(0,Math.min(weekOf(today()),WMAX));render()};
  $$("[data-goday]").forEach(el=>el.onclick=()=>{WEEK=weekOf(el.dataset.goday);render()});
  if($("#flt"))$("#flt").onchange=e=>{FILTER=e.target.value;render()};
  if($("#oo"))$("#oo").onclick=()=>{ONLYOPEN=!ONLYOPEN;render()};
  if($("#jump"))$("#jump").onclick=()=>{const t=today(),el=[...$$("[data-toggle]")].find(x=>x.dataset.toggle===t);if(el)el.scrollIntoView({behavior:"smooth",block:"center"})};
  if($("#pull"))$("#pull").onclick=()=>{const tod=today(),map=tasksByDay();
    Object.keys(map).forEach(day=>{if(day<tod)map[day].forEach(t=>{if(!STATE.done[t.id])STATE.moved[t.id]=tod})});save();render()};
  if($("#exp"))$("#exp").onclick=()=>{const map=tasksByDay();let o="CRONOGRAMA PCPR 2026 — Agente de Polícia Judiciária\n\n";
    Object.keys(map).sort().forEach(d=>{o+=fmt(d)+" ("+WD[s2d(d).getDay()]+")\n";
      map[d].forEach(t=>{const lk=STATE.links[t.id];o+="  "+(t.time||"     ")+" ["+(STATE.done[t.id]?"x":" ")+"] "+DISC[t.disc].n+" — "+t.t+" ("+t.min+"min)"+(t.src?"\n         "+t.src:"")+(lk?"\n         material: "+lk.url:"")+"\n"});o+="\n"});dump(o)};
  if($("#expLog"))$("#expLog").onclick=()=>{let o="REGISTROS DE DESEMPENHO — PCPR 2026\n\ndata;materia;acertos;total;percentual\n";
    STATE.logs.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(l=>o+=l.d+";"+DISC[l.disc].n+";"+l.hit+";"+l.tot+";"+Math.round(100*l.hit/l.tot)+"%\n");
    o+="\nJSON completo:\n"+JSON.stringify(STATE);dump(o)};
  if($("#rstLog"))$("#rstLog").onclick=()=>{if(confirm("Apagar todos os registros de desempenho? O cronograma não é afetado."))
    {STATE.logs=[];save();render()}};
  if($("#rst"))$("#rst").onclick=()=>{if(confirm("Isso apaga marcações, edições, links e registros. Continuar?"))
    {STATE={done:{},moved:{},removed:{},edited:{},custom:{},collapsed:{},links:{},logs:[]};save();render()}};
  if(MODAL){const c=document.getElementById("mdl"),val=()=>[...c.querySelectorAll(".fld input,.fld select")].map(x=>x.value);
    document.getElementById("mdlS").onclick=()=>{MODAL.onSave(val());save();closeModal()};
    document.getElementById("mdlC").onclick=closeModal;
    if(MODAL.extra)document.getElementById("mdlX").onclick=()=>{MODAL.onExtra();save();closeModal()};
    c.onclick=e=>{if(e.target===c)closeModal()};
    document.onkeydown=e=>{if(e.key==="Escape")closeModal()};
  }else document.onkeydown=null;
}
function logModal(id,disc,day){
  openModal({title:"Registrar bateria de questões",sub:"Entra no gráfico de desempenho e na nota projetada.",
    fields:[{label:"Matéria",type:"select",value:disc,options:Object.keys(DISC).filter(k=>DISC[k].q).map(k=>[k,DISC[k].n])},
            {label:"Acertos",type:"number",value:"",ph:"22"},{label:"Total de questões",type:"number",value:"",ph:"30"},
            {label:"Data",type:"date",value:day}],
    ok:"Registrar",
    onSave:v=>{const h=+v[1],t=+v[2];if(!(t>0)||!(h>=0)||h>t)return;STATE.logs.push({d:v[3]||day,disc:v[0],hit:h,tot:t,task:id})}});
}
function linkModal(k,cur,titulo){
  openModal({title:"Vincular material",sub:"Bloco: <b>"+esc(String(titulo).slice(0,90))+"</b>",
    fields:[{label:"Endereço do PDF ou da aula",value:cur.url||"",ph:"https://... ou pdfs/informatica-08.pdf",
             hint:"Link do Estratégia, do Drive, ou caminho relativo se você guardar os arquivos numa pasta ao lado do index.html."},
            {label:"Nome que aparece no bloco",value:cur.label||"",ph:"Ex.: Informática — Aula 08"}],
    ok:"Vincular",extra:cur.url?"Desvincular":null,
    onSave:v=>{const u=safeUrl(v[0]);if(u)STATE.links[k]={url:u,label:v[1].trim()}},onExtra:()=>{delete STATE.links[k]}});
}
function dump(t){const w=window.open("","_blank");if(w)w.document.write("<pre style='font:12px ui-monospace,monospace;white-space:pre-wrap;padding:20px'>"+esc(t)+"</pre>");else alert("Permita pop-ups para exportar.")}
(async function(){await load();if(STATE.view)VIEW=STATE.view;render()})();
</script>
</body>
</html>
