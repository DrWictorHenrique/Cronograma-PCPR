<!DOCTYPE html>
<html lang="pt-BR">
<head>

<script>
(function(){
  if (window.storage && typeof window.storage.get === "function") return;
  var mem={}, has=(function(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}})();
  window.storage={
    get:async k=>{var v=has?localStorage.getItem(k):(k in mem?mem[k]:null);return v==null?null:{key:k,value:v,shared:false}},
    set:async(k,v)=>{has?localStorage.setItem(k,v):mem[k]=v;return{key:k,value:v,shared:false}},
    delete:async k=>{has?localStorage.removeItem(k):delete mem[k];return{key:k,deleted:true,shared:false}},
    list:async p=>{var ks=[];if(has){for(var i=0;i<localStorage.length;i++){var kk=localStorage.key(i);if(!p||kk.indexOf(p)===0)ks.push(kk)}}else{for(var m in mem)if(!p||m.indexOf(p)===0)ks.push(m)}return{keys:ks,prefix:p,shared:false}}
  };
})();
</script>
<style>
:root{
  --ink:#0F1418; --ink-2:#2B343B; --ink-3:#5F6C75; --ink-4:#8C979E;
  --paper:#E3E5DF; --paper-2:#EDEFE9; --surface:#F7F8F3;
  --line:#CBCFC6; --line-soft:#DDE0D8;
  --carmim:#A32B21; --ocre:#9A7A18; --ok:#2E6B4F; --petrol:#1F4E5F;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sh:0 1px 2px rgba(15,20,24,.05),0 4px 16px -6px rgba(15,20,24,.10);
  --max:1080px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:64px}
button,select,input{font-family:inherit}
.boot{padding:56px 24px;font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.inner{max-width:var(--max);margin:0 auto;padding:0 22px}
@media(max-width:520px){.inner{padding:0 14px}}

.hd{background:var(--ink);color:#EDEEEA;padding:30px 0 0;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,var(--carmim) 0 25%,var(--petrol) 25% 50%,var(--ocre) 50% 62%,#3E6B52 62% 100%)}
.hd-grid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:22px}
@media(max-width:640px){.hd-grid{grid-template-columns:1fr;gap:16px}}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#7E8F98;margin-bottom:10px}
.hd h1{margin:0;font-size:clamp(24px,5vw,40px);font-weight:800;letter-spacing:-.035em;text-transform:uppercase;line-height:.96}
.hd h1 em{font-style:normal;color:#7E8F98}
.metrics{display:flex;gap:26px}
@media(max-width:640px){.metrics{gap:20px}}
.metric{font-family:var(--mono);line-height:1}
.metric b{display:block;font-size:clamp(28px,6.5vw,44px);font-weight:700;letter-spacing:-.05em}
.metric i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7E8F98;display:block;margin-top:7px}
.metric.good b{color:#7FBFA0} .metric.mid b{color:#E0B85A} .metric.bad b{color:#E08B7F}

.sig{background:#0B0F12;color:#DDE0DC;padding:20px 0 22px}
.sig-lab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6F7D85;margin-bottom:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid100{display:grid;grid-template-columns:repeat(25,1fr);gap:2px}
@media(max-width:640px){.grid100{grid-template-columns:repeat(20,1fr)}}
.q{aspect-ratio:1;border-radius:1px;opacity:.2;transition:opacity .5s ease}
.q.on{opacity:1}
@media(prefers-reduced-motion:reduce){.q{transition:none}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px}
.legend div{font-family:var(--mono);font-size:10px;color:#8B979E;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:1px;display:inline-block;flex:none}

.nav{position:sticky;top:0;z-index:30;background:rgba(233,234,229,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--max);margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
@media(max-width:520px){.nav-in{padding:0 8px}}
.tab{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);padding:14px 14px 12px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--carmim);font-weight:700}
.tab:focus-visible{outline:2px solid var(--petrol);outline-offset:-2px}

.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:14px 0 4px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);padding:7px 11px;border-radius:3px;cursor:pointer;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--carmim);border-color:var(--carmim);color:#fff}
.btn.pri:hover{background:#8C231A;border-color:#8C231A;color:#fff}
.btn.warn:hover{border-color:var(--carmim);color:var(--carmim)}
.sel{font-family:var(--mono);font-size:11px;padding:7px 8px;border:1px solid var(--line);background:var(--surface);border-radius:3px;color:var(--ink-2)}
.spacer{flex:1}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;box-shadow:var(--sh);padding:18px;margin-top:14px}
.card h3{margin:0 0 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2)}
.card.alert{border-left:3px solid var(--carmim)}
.note{font-size:12.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.55}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}

.today-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{flex:none}
.today-t{flex:1;min-width:180px}
.today-t b{display:block;font-size:15px;letter-spacing:-.01em}
.today-t span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.next{margin-top:10px;font-size:13px;color:var(--ink-2);border-left:2px solid var(--carmim);padding-left:10px}

.phase{margin:30px 0 10px;padding-bottom:9px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.phase h2{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}
.phase p{margin:0;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.day{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:3px;margin-top:8px;box-shadow:var(--sh);transition:border-color .15s}
.day:hover{border-left-color:var(--ink-4)}
.day.today{border-left-color:var(--carmim);box-shadow:0 0 0 1px var(--carmim),var(--sh)}
.day.past{opacity:.55}
.day.exam{border-left-color:var(--ocre)}
.day.full{border-left-color:var(--ok)}
.day-h{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.day-d{font-family:var(--mono);font-size:12.5px;font-weight:700}
.day-w{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3)}
.win{font-family:var(--mono);font-size:10.5px;color:var(--petrol)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;border-radius:2px;color:var(--carmim)}
.day-m{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:8px}
.mini{width:52px;height:4px;background:var(--paper);border-radius:2px;overflow:hidden;display:inline-block}
.mini i{display:block;height:100%;background:var(--ok)}
.day-b{padding:0 14px 12px}

.task{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-soft)}
.task:first-child{border-top:0}
.hora{font-family:var(--mono);font-size:11px;color:var(--ink-4);flex:none;width:42px;padding-top:3px;text-align:right}
.chk{flex:none;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer;position:relative;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--ink)}
.chk:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk.done::after{content:"";position:absolute;left:5.5px;top:1.5px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.t-body{flex:1;min-width:0}
.t-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#fff;padding:2px 6px;border-radius:2px;white-space:nowrap}
.kind{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid currentColor}
.kind.aula{color:var(--ink-3)} .kind.quest{color:var(--petrol);background:#EAF1F3}
.kind.sim{color:var(--carmim);background:#FBEEEC} .kind.gap{color:var(--ocre);background:#FBF5E3}
.pass{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.t-title{font-size:13.7px;line-height:1.38}
.src{font-family:var(--mono);font-size:10px;color:var(--ink-4);margin-top:3px}
.task.done .t-title{text-decoration:line-through;color:var(--ink-4)}
.mat{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--petrol);text-decoration:none;border:1px solid var(--line);background:var(--paper-2);padding:3px 7px;border-radius:3px;max-width:100%}
.mat:hover{border-color:var(--petrol)}
.mat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:inline-block;margin-top:6px;margin-left:6px;font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:3px;color:#fff}
.t-act{display:flex;gap:1px;flex:none;opacity:.28;transition:opacity .18s}
.task:hover .t-act,.t-act:focus-within{opacity:1}
@media(hover:none){.t-act{opacity:.7}}
.ico{border:0;background:none;cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding:4px 5px;border-radius:3px;line-height:1}
.ico:hover{background:var(--paper);color:var(--ink)}
.ico.rm:hover{color:var(--carmim)}
.ico:focus-visible{outline:2px solid var(--petrol);outline-offset:1px}
.add{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);background:none;border:1px dashed var(--line);width:100%;padding:7px;margin-top:9px;cursor:pointer;border-radius:3px;letter-spacing:.06em;text-transform:uppercase}
.add:hover{border-color:var(--ink-3);color:var(--ink)}

.stat{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--mono);font-size:11px}
.stat .nm{width:154px;flex:none;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.stat .track{flex:1;height:9px;background:var(--paper);border-radius:2px;overflow:hidden}
.stat .fill{height:100%;transition:width .5s ease}
.stat .pc{width:92px;text-align:right;flex:none;color:var(--ink-3)}
@media(max-width:600px){.stat .nm{width:96px;font-size:10px}.stat .pc{width:70px;font-size:10px}}
.rot{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;font-family:var(--mono);font-size:11px}
.rot div{border-left:2px solid var(--line);padding-left:10px}
.rot b{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--ink-4);margin-bottom:3px}

.mgroup h4{margin:0 0 8px;width:100%;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px}
.mrow .mt{flex:1;min-width:0}
.mrow .mu{font-family:var(--mono);font-size:10.5px;color:var(--petrol);word-break:break-all}
.mrow .mu.empty{color:var(--ink-4)}

.chart{width:100%;height:auto;display:block}
.axis{font-family:var(--mono);font-size:9px;fill:var(--ink-4)}
.empty{font-family:var(--mono);font-size:11.5px;color:var(--ink-4);padding:22px 0;text-align:center;border:1px dashed var(--line);border-radius:3px}

.mdl{position:fixed;inset:0;z-index:80;background:rgba(15,20,24,.5);display:flex;align-items:center;justify-content:center;padding:18px}
.mdl-c{background:var(--surface);border-radius:5px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 60px -12px rgba(0,0,0,.4);max-height:88vh;overflow:auto}
.mdl-c h4{margin:0 0 4px;font-size:14px}
.mdl-c p.sub{margin:0 0 16px;font-size:12.5px;color:var(--ink-3)}
.fld{margin-bottom:13px}
.fld label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.fld textarea{width:100%;font-family:var(--mono);font-size:11.5px;line-height:1.6;resize:vertical;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--paper-2);color:var(--ink)}
  .fld input,.fld select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;background:var(--paper-2);color:var(--ink)}
.fld input:focus,.fld select:focus{outline:2px solid var(--petrol);outline-offset:-1px;background:#FCFDF9}
.fld .hint{font-size:11.5px;color:var(--ink-4);margin-top:5px}
.mdl-a{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.foot{padding:26px 0 0;font-family:var(--mono);font-size:10.5px;color:var(--ink-4);line-height:1.75}

  /* ---------- visão semanal ---------- */
  .wk-bar{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px}
  .wk-nav{display:flex;align-items:center;gap:6px}
  .wk-nav b{font-family:var(--mono);font-size:13px;letter-spacing:.02em;min-width:104px;text-align:center}
  .nav-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer;color:var(--ink-3);font-size:15px;line-height:1}
  .nav-btn:hover{border-color:var(--ink);color:var(--ink)}
  .nav-btn:disabled{opacity:.35;cursor:default}
  .wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;align-items:start}
  .cal{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;box-shadow:var(--sh);padding:12px}
  .cal-m{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:4px 0 10px}
  .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal-g span{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);padding:3px 0}
  .cal-g button{font-family:var(--mono);font-size:11px;border:0;background:none;color:var(--ink-2);padding:5px 0;border-radius:3px;cursor:pointer;position:relative}
  .cal-g button:hover{background:var(--paper)}
  .cal-g button.wk{background:var(--paper);font-weight:700;color:var(--ink)}
  .cal-g button.tod{background:var(--carmim);color:#fff}
  .cal-g button.off{color:var(--line);cursor:default}
  .cal-g button.off:hover{background:none}
  .dcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden}
  .dcard.tod{border-color:var(--carmim);box-shadow:0 0 0 1px var(--carmim),var(--sh)}
  .dcard.pst{opacity:.6}
  .dcard.ok{border-color:var(--ok)}
  .dcard-h{padding:10px 12px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px}
  .dcard-h .dt{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .dcard-h .mt{font-family:var(--mono);font-size:10px;color:var(--ink-4);display:block;margin-top:2px}
  .badge{margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;border:2px solid var(--ocre);color:var(--ocre)}
  .badge.z{border-color:var(--ok);color:var(--ok)}
  .dcard-b{padding:9px 10px;max-height:330px;overflow-y:auto;overscroll-behavior:contain}
  .dcard-b:empty::after{content:"sem blocos";font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
  .act{display:flex;gap:8px;align-items:flex-start;background:var(--paper-2);border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:3px;padding:8px 9px;margin-bottom:7px}
  .act:last-child{margin-bottom:0}
  .act .ab{flex:1;min-width:0}
  .act .al{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-4);display:block;margin-bottom:2px}
  .act .at{font-size:12.3px;line-height:1.32;color:var(--petrol)}
  .act .as{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);margin-top:3px;display:block}
  .act.dn{opacity:.5}
  .act.dn .at{text-decoration:line-through;color:var(--ink-4)}
  .act .ax{display:flex;flex-direction:column;gap:3px;align-items:center;flex:none}
  .act .chk{width:16px;height:16px;margin-top:1px}
  .act .chk.done::after{left:4.5px;top:1px;height:8px}
  .pin{font-size:11px;text-decoration:none;line-height:1;opacity:.75}
  .pin:hover{opacity:1}

  /* alternância entre dias e redução de ruído */
  .act{border-left-width:3px}
  .act .at{color:var(--ink-2)}
  a.at{display:block;text-decoration:none;color:var(--ink-2)}
  a.at:hover{color:var(--petrol);text-decoration:underline;text-underline-offset:2px}
  a.at:focus-visible{outline:2px solid var(--petrol);outline-offset:2px;border-radius:2px}
  .mlink{display:inline-flex;align-items:center;gap:4px;margin-top:5px;max-width:100%;font-family:var(--mono);font-size:9.5px;color:var(--petrol);text-decoration:none;background:rgba(31,78,95,.07);border:1px solid rgba(31,78,95,.18);padding:2px 6px;border-radius:3px}
  .mlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mlink:hover{background:rgba(31,78,95,.13);border-color:var(--petrol)}
  .t-title a{color:inherit;text-decoration:none}
  .t-title a:hover{color:var(--petrol);text-decoration:underline;text-underline-offset:2px}

  /* ============ refinamento visual ============ */
  .act{
    position:relative;padding:10px 11px 10px 12px;margin-bottom:8px;border-radius:4px;
    border:1px solid var(--line-soft);border-left:0;overflow:hidden;
  }
  .act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dc,var(--line))}
  .act .al{
    font-size:9.5px;letter-spacing:.13em;font-weight:700;color:var(--dc,var(--ink-4));
    display:flex;align-items:center;gap:6px;margin-bottom:4px;
  }
  .act .al i{font-style:normal;color:var(--ink-4);font-weight:400;letter-spacing:.06em}
  .act .at{font-size:13.5px;line-height:1.4;font-weight:600;letter-spacing:-.005em}
  .act .as{font-size:10px;line-height:1.5;color:var(--ink-3);margin-top:5px;letter-spacing:0}
  .act .as b{font-weight:600;color:var(--ink-2)}
  a.at{position:relative}
  a.at::after{content:"↗";font-size:9px;margin-left:5px;opacity:.5;vertical-align:1px}
  a.at:hover{color:var(--dc,var(--petrol))}

  /* fundo tênue por matéria, herdado da cor da disciplina */
  @supports not (background:color-mix(in srgb,red 5%,blue)){
    .act{background:var(--paper-2)}
  }

  .dcard{border-radius:6px}
  .dcard-h{padding:11px 13px}
  .dcard-h .dt{font-size:12px;letter-spacing:.09em}
  .dcard-h .mt{font-size:10.5px;margin-top:3px;letter-spacing:.02em}
  .dcard-b{padding:11px 11px 12px}
  .badge{width:26px;height:26px;font-size:11px}

  .cal{border-radius:6px;padding:14px}
  .cal-g button{padding:6px 0;font-size:11.5px}
  .wk-nav b{font-size:13.5px}

  /* lista corrida: mesma linguagem */
  .t-title{font-size:14px;font-weight:600;line-height:1.4}
  .src{font-size:10.5px;margin-top:4px}
  .chip{font-size:9.5px;letter-spacing:.1em;font-weight:700}
  .pass{font-size:10.5px}
  .task{padding:11px 0}

  /* legenda de cores */
  .keys{display:flex;flex-wrap:wrap;gap:7px}
  .key{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
       letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line-soft);
       border-radius:20px;padding:4px 10px 4px 7px;background:var(--surface)}
  .key i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

  /* ===== bloco de atividade, v3 ===== */
  .act{
    --tint:color-mix(in srgb,var(--dc,#888) 9%,var(--surface));
    background:var(--tint);border:1px solid color-mix(in srgb,var(--dc,#888) 22%,transparent);
    border-left:0;border-radius:5px;padding:9px 11px 9px 13px;margin-bottom:9px;
    position:relative;overflow:hidden;display:block;
  }
  @supports not (background:color-mix(in srgb,red 5%,blue)){.act{background:var(--paper-2)}}
  .act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dc,var(--line))}
  .act.dn{opacity:.48}
  .a-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .a-hr{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1}
  .a-dur{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);
         background:rgba(255,255,255,.6);border:1px solid var(--line-soft);border-radius:20px;padding:2px 8px;line-height:1.3}
  .a-kd{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;
        color:var(--dc);opacity:.85;margin-left:auto;margin-right:2px}
  .a-top .chk{margin-top:0;flex:none;background:rgba(255,255,255,.75);width:19px;height:19px}
  .a-top .chk.done{background:var(--ok);border-color:var(--ok)}
  .a-top .chk.done::after{left:6px;top:2px;width:4.5px;height:10px}
  .a-top .chk:hover{border-color:var(--dc)}
  .a-top .chk.done:hover{border-color:var(--ok)}
  .a-mat{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
         font-weight:700;color:var(--dc);margin-bottom:3px}
  .act .at{font-size:13.5px;line-height:1.42;font-weight:600;letter-spacing:-.005em;color:var(--ink);display:block}
  a.at:hover{color:var(--dc)}
  .act .as{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:5px;line-height:1.5}
  .a-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
  .a-log{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);
         background:rgba(255,255,255,.55);border:1px solid var(--line-soft);border-radius:20px;
         padding:3px 9px;cursor:pointer;transition:all .15s}
  .a-log:hover{border-color:var(--dc);color:var(--dc);background:#fff}
  .a-log:focus-visible{outline:2px solid var(--petrol);outline-offset:1px}
  .act.dn .a-log{display:none}
  .a-sc{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;border-radius:20px;padding:3px 8px}

  /* ===== acerto por matéria ===== */
  .stat{display:grid;grid-template-columns:1fr 84px;gap:4px 12px;align-items:center;
        padding:11px 2px;margin:0;border-top:1px solid var(--line-soft)}
  .stat:first-of-type{border-top:0}
  .stat .nm{width:auto;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink);
            letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
  .stat .nm .dot{width:10px;height:10px;border-radius:3px}
  .stat .pc{width:auto;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-2)}
  .stat .pc.none{font-weight:400;color:var(--ink-4);font-size:10.5px}
  .stat .track{grid-column:1/-1;height:7px;background:rgba(15,20,24,.06);border-radius:20px}
  .stat .fill{border-radius:20px}
  .stat .qt{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);letter-spacing:.04em;font-weight:400}

  /* ===== cartão do dia (topo) ===== */
  .today-card{gap:20px;padding:20px}
  .today-t b{font-size:16px;letter-spacing:-.015em}
  .today-t span{font-size:11.5px}
  .next{margin-top:12px;border-left:3px solid var(--carmim);padding:2px 0 2px 12px;font-size:13.5px;line-height:1.45}
  .next b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--carmim);display:block;margin-bottom:3px}

/* ==================== TEMA HUD ==================== */
:root{
  --ink:#E6EDF6; --ink-2:#B6C4D6; --ink-3:#8296AE; --ink-4:#5E7189;
  --paper:#080B11; --paper-2:#0F141C; --surface:#121926;
  --line:#233043; --line-soft:#1B2534;
  --carmim:#F43F5E; --ocre:#FBBF24; --ok:#34D399; --petrol:#22D3EE;
  --neon:#22D3EE; --neon2:#818CF8;
  --sh:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -12px rgba(0,0,0,.8);
}
html,body{background:var(--paper)}
body{
  background-image:
    radial-gradient(1100px 600px at 12% -8%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(900px 520px at 92% 4%, rgba(129,140,248,.09), transparent 60%),
    linear-gradient(rgba(255,255,255,.016) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.016) 1px, transparent 1px);
  background-size:auto,auto,52px 52px,52px 52px;
  background-attachment:fixed;
}

/* cabeçalho */
.hd{background:linear-gradient(160deg,#0C121C 0%,#111A28 100%);border-bottom:0;color:var(--ink)}
.hd::after{height:1px;background:linear-gradient(90deg,transparent,var(--neon) 18%,var(--neon2) 52%,var(--carmim) 84%,transparent);box-shadow:0 0 16px rgba(34,211,238,.55)}
.eyebrow{color:var(--neon);opacity:.85;text-shadow:0 0 14px rgba(34,211,238,.35)}
.hd h1{text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hd h1 em{color:var(--ink-4)}
.metric i{color:var(--ink-4)}
.metric b{text-shadow:0 0 22px currentColor}
.metric.good b{color:#34D399}.metric.mid b{color:#FBBF24}.metric.bad b{color:#F43F5E}

/* faixa das 100 questões */
.sig{background:#070A0F;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.sig-lab{color:var(--ink-4)}
.q{border-radius:2px;opacity:.13}
.q.on{opacity:1;box-shadow:0 0 7px currentColor,0 0 2px currentColor}
.legend div{color:var(--ink-3)}
.dot{border-radius:2px;box-shadow:0 0 7px currentColor}

/* navegação */
.nav{background:rgba(8,11,17,.86);border-bottom:1px solid var(--line-soft);backdrop-filter:saturate(1.5) blur(14px)}
.tab{color:var(--ink-4)}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--neon);border-bottom-color:var(--neon);text-shadow:0 0 14px rgba(34,211,238,.5)}

/* botões */
.btn{background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--ink-2);border-radius:7px;transition:all .16s}
.btn:hover{border-color:var(--neon);color:var(--neon);background:rgba(34,211,238,.09);box-shadow:0 0 14px rgba(34,211,238,.16)}
.btn.on{background:var(--neon);color:#04121A;border-color:var(--neon);box-shadow:0 0 18px rgba(34,211,238,.4);font-weight:700}
.btn.pri{background:linear-gradient(135deg,var(--neon),#0EA5C4);border-color:transparent;color:#04121A;font-weight:700;box-shadow:0 0 18px rgba(34,211,238,.3)}
.btn.pri:hover{background:linear-gradient(135deg,#5BE4F5,var(--neon));color:#04121A;box-shadow:0 0 26px rgba(34,211,238,.5)}
.btn.warn:hover{border-color:var(--carmim);color:var(--carmim);background:rgba(244,63,94,.1);box-shadow:0 0 14px rgba(244,63,94,.18)}
.sel{background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--ink-2);border-radius:7px}
.sel option{background:#121926;color:var(--ink)}

/* cartões */
.card{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
      border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--sh)}
.card h3{color:var(--ink-3);letter-spacing:.16em}
.card.alert{border-left:2px solid var(--carmim);box-shadow:-14px 0 26px -20px var(--carmim),var(--sh)}
.note{color:var(--ink-3)}

/* fases */
.phase{border-bottom:1px solid var(--line)}
.phase h2{color:var(--ink);text-shadow:0 0 18px rgba(34,211,238,.18)}
.phase p{color:var(--ink-4)}

/* dias — semana */
.dcard{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.006));
       border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--sh)}
.dcard.a,.dcard.b{background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,.006))}
.dcard.b{background:linear-gradient(180deg,rgba(255,255,255,.014),rgba(255,255,255,.002))}
.dcard.a .dcard-h,.dcard.b .dcard-h{background:rgba(255,255,255,.022)}
.dcard-h{border-bottom:1px solid var(--line-soft)}
.dcard.tod{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 34px -8px rgba(34,211,238,.5),var(--sh)}
.dcard.ok{border-color:rgba(52,211,153,.5);box-shadow:0 0 24px -12px rgba(52,211,153,.6),var(--sh)}
.dcard.pst{opacity:.42}
.dcard-h .dt{color:var(--ink)}
.badge{border-color:var(--ocre);color:var(--ocre);background:rgba(251,191,36,.1);box-shadow:0 0 14px rgba(251,191,36,.22)}
.badge.z{border-color:var(--ok);color:var(--ok);background:rgba(52,211,153,.1);box-shadow:0 0 14px rgba(52,211,153,.28)}
.win{color:var(--neon);opacity:.7}
.tag{color:var(--neon);border-color:var(--neon);background:rgba(34,211,238,.1);box-shadow:0 0 12px rgba(34,211,238,.2)}

/* blocos de atividade */
.act{
  background:linear-gradient(135deg,color-mix(in srgb,var(--dc,#888) 13%,#111823) 0%,#0E1520 100%);
  border:1px solid color-mix(in srgb,var(--dc,#888) 26%,transparent);
  border-left:0;border-radius:9px;
}
.dcard.a .act,.dcard.b .act,.day.a .act,.day.b .act{
  background:linear-gradient(135deg,color-mix(in srgb,var(--dc,#888) 14%,#101722) 0%,#0C1119 100%);
  border-color:color-mix(in srgb,var(--dc,#888) 26%,transparent);
}
@supports not (background:color-mix(in srgb,red 5%,blue)){
  .act,.dcard.a .act,.dcard.b .act{background:#101722;border-color:var(--line)}
}
.act::before{width:3px;background:var(--dc,var(--line));box-shadow:0 0 12px var(--dc,transparent)}
.act .a-hr{color:var(--ink);text-shadow:0 0 14px rgba(255,255,255,.14)}
.a-dur{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);color:var(--ink-2)}
.a-kd{color:var(--dc);opacity:.9;text-shadow:0 0 10px currentColor}
.a-mat{color:var(--dc);text-shadow:0 0 12px currentColor}
.act .at{color:var(--ink)}
a.at:hover{color:var(--dc);text-shadow:0 0 14px currentColor}
.act .as{color:var(--ink-4)}
.a-log{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.09);color:var(--ink-3);border-radius:20px}
.a-log:hover{border-color:var(--dc);color:var(--dc);background:rgba(255,255,255,.09);box-shadow:0 0 12px -2px var(--dc)}
.a-sc{box-shadow:0 0 12px -3px currentColor;color:#06111A;font-weight:800;border:0;cursor:pointer;font-family:var(--mono);font-size:9.5px;padding:3px 8px;border-radius:20px}
  .a-sc:hover{filter:brightness(1.18);box-shadow:0 0 16px -2px currentColor}
  .score{border:0;cursor:pointer;font-family:var(--mono)}
  .score:hover{filter:brightness(1.18)}
.act.dn{opacity:.34}

/* checkbox */
.chk{background:rgba(255,255,255,.05);border-color:var(--line);border-radius:6px}
.chk:hover{border-color:var(--neon);box-shadow:0 0 10px rgba(34,211,238,.3)}
.chk.done,.a-top .chk.done{background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px rgba(52,211,153,.55)}
.chk.done::after,.a-top .chk.done::after{border-color:#04140E}
.a-top .chk{background:rgba(255,255,255,.06)}

/* lista corrida */
.day{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.005));
     border:1px solid var(--line-soft);border-left:2px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
.day.a,.day.b{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.005))}
.day.b{background:linear-gradient(180deg,rgba(255,255,255,.012),transparent)}
.day.today{border-left-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 30px -10px rgba(34,211,238,.45),var(--sh)}
.day.full{border-left-color:var(--ok)}
.day.exam{border-left-color:var(--ocre);background:linear-gradient(180deg,rgba(251,191,36,.09),transparent)}
.day.past{opacity:.4}
.task{border-top:1px solid var(--line-soft)}
.t-title{color:var(--ink)}
.src{color:var(--ink-4)}
.chip{color:#06111A;font-weight:800;box-shadow:0 0 12px -3px currentColor}
.kind.aula{color:var(--ink-4)}
.kind.quest{color:var(--neon);background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.35)}
.kind.sim{color:var(--carmim);background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.35)}
.kind.gap{color:var(--ocre);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)}
.ico{color:var(--ink-4)}
.ico:hover{background:rgba(255,255,255,.07);color:var(--neon)}
.add{border-color:var(--line);color:var(--ink-4);border-radius:8px}
.add:hover{border-color:var(--neon);color:var(--neon);background:rgba(34,211,238,.05)}
.mini{background:rgba(255,255,255,.07)}
.mini i{background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* calendário */
.cal{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.005));border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--sh)}
.cal-m{color:var(--ink-3)}
.cal-g span{color:var(--ink-4)}
.cal-g button{color:var(--ink-2);border-radius:6px}
.cal-g button:hover{background:rgba(255,255,255,.07)}
.cal-g button.wk{background:rgba(34,211,238,.14);color:var(--neon);font-weight:700}
.cal-g button.tod{background:var(--neon);color:#04121A;box-shadow:0 0 14px rgba(34,211,238,.5)}
.cal-g button.off{color:var(--line)}
.nav-btn{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink-3);border-radius:7px}
.nav-btn:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 12px rgba(34,211,238,.2)}
.wk-nav b{color:var(--neon)}

/* estatísticas */
.stat{border-top:1px solid var(--line-soft)}
.stat .nm{color:var(--ink)}
.stat .pc{color:var(--ink-2)}
.stat .pc.none{color:var(--ink-4)}
.stat .track{background:rgba(255,255,255,.05)}
.stat .fill{box-shadow:0 0 12px -2px currentColor}
.stat .qt{color:var(--ink-4)}
.key{background:rgba(255,255,255,.04);border:1px solid var(--line-soft);color:var(--ink-2)}
.rot div{border-left:2px solid var(--neon);opacity:.92}
.rot b{color:var(--ink-4)}
.empty{border-color:var(--line);color:var(--ink-4);border-radius:9px}
.today-t b{color:var(--ink)}
.today-t span{color:var(--ink-3)}
.next{background:rgba(255,255,255,.028);border-radius:0 8px 8px 0;padding:10px 12px;color:var(--ink-2)}

/* materiais */
.mrow{border-top:1px solid var(--line-soft)}
.mgroup h4{color:var(--ink-2)}
.mrow .mu{color:var(--neon);opacity:.75}
.mrow .mu.empty{color:var(--ink-4);opacity:1}
.mat{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.28);color:var(--neon)}

/* modal */
.mdl{background:rgba(4,6,10,.8);backdrop-filter:blur(5px)}
.mdl-c{background:#101724;border:1px solid var(--line);border-radius:14px;box-shadow:0 0 0 1px rgba(34,211,238,.12),0 30px 70px -20px #000}
.mdl-c h4{color:var(--ink)}
.mdl-c p.sub{color:var(--ink-3)}
.fld label{color:var(--ink-4)}
.fld input,.fld select,.fld textarea{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);border-radius:8px}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:rgba(34,211,238,.06);outline:2px solid var(--neon);outline-offset:-1px}
.fld .hint{color:var(--ink-4)}
.foot{color:var(--ink-4)}
::selection{background:rgba(34,211,238,.3);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}

/* ===== teoria e questões ===== */
.tlink{color:var(--ink);text-decoration:none;font-weight:600}
.tlink:hover{color:var(--neon);text-decoration:underline;text-underline-offset:3px}
.teo h2{margin:4px 0 6px;font-size:clamp(19px,4.6vw,24px);letter-spacing:-.02em;line-height:1.2}
.teo{border-top:2px solid var(--dc)}
.teo-b{font-size:14.5px;line-height:1.68;color:var(--ink-2)}
.teo-b h4{margin:20px 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dc)}
.teo-b p{margin:8px 0}
.teo-b ul{margin:6px 0;padding-left:20px}
.teo-b li{margin:4px 0}
.teo-b b{color:var(--ink)}
.cf{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ocre);border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.1);border-radius:3px;padding:1px 5px;white-space:nowrap}
.qz{border-left:2px solid var(--dc)}
.q-h{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.q-e{font-size:14.5px;line-height:1.6;color:var(--ink)}
.q-alts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.q-alt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--ink-2);font-size:13.8px;line-height:1.48;cursor:pointer;font-family:var(--sans)}
.q-alt b{font-family:var(--mono);color:var(--ink-4);flex:none}
.q-alt:hover:not([disabled]){border-color:var(--neon);color:var(--ink)}
.q-alt[disabled]{cursor:default}
.q-alt.ok{border-color:var(--ok);background:rgba(52,211,153,.1);color:var(--ink)}
.q-alt.ok b{color:var(--ok)}
.q-alt.no{border-color:var(--carmim);background:rgba(244,63,94,.1)}
.q-alt.no b{color:var(--carmim)}

const d2s=d=>d.toISOString().slice(0,10);
const s2d=s=>{const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd,12,0,0)};
const addD=(s,n)=>{const d=s2d(s);d.setDate(d.getDate()+n);return d2s(d)};

function today(){const n=new Date();const t=d2s(new Date(n.getFullYear(),n.getMonth(),n.getDate(),12));return t<START?START:t}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function safeUrl(u){u=String(u||"").replace(/[\s\u200b]+/g,"").trim();return /^(https?:|\.\/|\/|[\w\-.]+\/)/i.test(u)?u:""}

/* ---------- geração ---------- */
function take(q,ph){for(let i=0;i<q.length;i++){if((q[i].ph||1)<=ph)return q.splice(i,1)[0]}return null}
function slotsOf(){ /* passada seca: quantos blocos cada matéria tem em cada fase */
  const S={1:{},2:{},3:{}};let rot=0,cur=START;
  while(cur<=END){const wd=s2d(cur).getDay(),ph=phaseOf(cur);
    if(wd!==0)(TPL[ph][wd]||[]).forEach(d=>{if(d==="ROT")d=ROTSEQ[rot++%ROTSEQ.length];S[ph][d]=(S[ph][d]||0)+1});
    cur=addD(cur,1)}
  return S;
}
function generate(){
  const queues={},dr={},plan={},S=slotsOf(),K={};let rot=0,esc=0,oral=0;
  for(const d in BANK)queues[d]=BANK[d].map(x=>Object.assign({disc:d},x));
  for(const d in DRILL)dr[d]=0;
  let cur=START;
  while(cur<=END){
    const wd=s2d(cur).getDay(),ph=phaseOf(cur),ts=TIMES[wd],wk=Math.floor((s2d(cur)-s2d(START))/6048e5);plan[cur]=[];
    if(wd===0){plan[cur]=sundayBlocks(cur,wk,ph).map(b=>Object.assign({date:cur},b));cur=addD(cur,1);continue}
    (TPL[ph][wd]||[]).forEach((d0,i)=>{
      let d=d0;
      if(d==="ROT")d=ROTSEQ[rot++%ROTSEQ.length];
      if(d==="ESC"){const e=ESCQ[esc%ESCQ.length];plan[cur].push({id:"ESC.e"+esc,disc:"ESC",tp:"esc",t:e[1],src:esc<ESCQ.length?"Cronometre e compare com o espelho da banca ou com a peça-modelo":"2ª rodada do tema: reescreva sem consultar e compare com a versão anterior",min:50,date:cur,time:ts[i]});esc++;return}
      if(d==="ORAL"){plan[cur].push({id:"ORAL.o"+oral,disc:"ORAL",tp:"rev",t:ORALQ[oral%ORALQ.length],src:"Temas da semana no cronograma",min:50,date:cur,time:ts[i]});oral++;return}
      /* nas fases 2 e 3 a segunda passada e a revisão se intercalam com provas anteriores, espalhadas pela fase */
      const key=ph+d,k=K[key]=(K[key]||0),n=BANK[d].filter(x=>x.ph===ph).length,s=S[ph][d]||1;K[key]++;
      const vez=ph===1||n>=s||queues[d].some(x=>x.ph<ph)||Math.floor((k+1)*n/s)>Math.floor(k*n/s);
      const it=vez?take(queues[d],ph):null;
      if(it)plan[cur].push({id:d+"."+it.k,disc:d,tp:it.tp,t:it.t,src:it.src,tk:it.tk,min:50,date:cur,time:ts[i]});
      else{const m=dr[d]++;plan[cur].push({id:d+".x"+m,disc:d,tp:"quest",t:DRILL[d][m%DRILL[d].length],src:PROVAS,min:50,date:cur,time:ts[i]})}
    });
    cur=addD(cur,1);
  }
  const sobra=[];for(const d in queues)queues[d].forEach(it=>sobra.push({id:d+"."+it.k,disc:d,tp:it.tp,t:it.t,src:it.src,min:50}));
  return{plan:plan,sobra:sobra};
}

function discAcc(logs){const by={};logs.forEach(l=>{(by[l.disc]=by[l.disc]||[]).push(l)});const o={};
  for(const d in by){const last=by[d].slice(-4),h=last.reduce((a,l)=>a+l.hit,0),t=last.reduce((a,l)=>a+l.tot,0);if(t>0)o[d]={a:h/t,h:h,t:t,n:by[d].length}}return o}
function projected(logs){const acc=discAcc(logs),H=logs.reduce((a,l)=>a+l.hit,0),T=logs.reduce((a,l)=>a+l.tot,0),base=T>0?H/T:0;
  let s=0,known=0;for(const k in DISC){if(!DISC[k].q)continue;if(acc[k]){s+=DISC[k].q*acc[k].a;known+=DISC[k].q}else s+=DISC[k].q*base}
  return{score:s,known:known,geral:base,H:H,T:T,acc:acc}}

function blankState(){return{done:{},undone:{},moved:{},removed:{},edited:{},custom:{},collapsed:{},links:{},delLinks:{},reTime:{},logs:[],delLogs:{},qa:{},srs:{},srsOut:{},fz:{},lido:{}}}
function mergeState(a,b){ /* b é o mais recente em caso de conflito */
  const o={};
  ["moved","removed","edited","collapsed","links","custom","qa","srs","srsOut","fz","reTime"].forEach(k=>o[k]=Object.assign({},a[k]||{},b[k]||{}));
  /* leitura: guarda a página mais avançada */
  o.lido=Object.assign({},a.lido||{});for(const k in (b.lido||{}))o.lido[k]=Math.max(o.lido[k]||0,b.lido[k]);
  /* marcação de bloco: vence a ação mais recente (marcar x desmarcar) entre os aparelhos */
  const ts=v=>v===true?1:(+v||0);
  o.done={};o.undone=Object.assign({},a.undone||{});
  for(const k in (b.undone||{}))o.undone[k]=Math.max(o.undone[k]||0,b.undone[k]);
  for(const src of [a.done||{},b.done||{}])for(const k in src)o.done[k]=Math.max(o.done[k]||0,ts(src[k]));
  for(const k in o.done)if(o.undone[k]&&o.undone[k]>=o.done[k])delete o.done[k];
  /* caderno: questão fixada depois do último erro sai da fila */
  for(const k in o.srs){const s=o.srs[k],out=o.srsOut[k];if(!s||out&&out>=(s.em||"")&&!(s.last&&s.last>out))delete o.srs[k]}
  /* exclusões: uma remoção feita em qualquer aparelho vence, se for posterior ao vínculo */
  o.delLinks=Object.assign({},a.delLinks||{},b.delLinks||{});
  for(const k in o.delLinks){
    const lk=o.links[k];
    if(!lk||!(lk.at>o.delLinks[k]))delete o.links[k];
  }
  /* registros de questões: por identificador; a versão mais recente vence e exclusões se propagam */
  o.delLogs=Object.assign({},a.delLogs||{},b.delLogs||{});
  const byId={},lg=[];
  (a.logs||[]).concat(b.logs||[]).forEach(l=>{const k=l.id||(l.d+"|"+l.disc+"|"+l.hit+"|"+l.tot+"|"+(l.task||""));if(o.delLogs[k])return;if(!(k in byId))lg.push(k);byId[k]=l});
  o.logs=lg.map(k=>byId[k]);
  o.view=b.view||a.view;o.resetAt=Math.max(a.resetAt||0,b.resetAt||0);o.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return o;
}

function slotTime(day,i){
  const wd=s2d(day).getDay(),ts=(typeof DAYTIMES!=="undefined"&&DAYTIMES[day])||TIMES[wd]||[];
  if(i<ts.length)return ts[i];
  const base=ts.length?ts[ts.length-1]:"20:00";
  const[h,m]=base.split(":").map(Number);
  const tot=h*60+m+70*(i-ts.length+1);
  return String(Math.floor(tot/60)%24).padStart(2,"0")+":"+String(tot%60).padStart(2,"0");
}
const PESO={PEN:1,PP:2,LPE:3,CON:4,ADM:5,ESC:6,ML:7,CRIM:8,DH:9,ORAL:10,INFO:11,REV:12};
function replanejar(soAulas){
  const tod=today(),map=tasksByDay(),atras=[];
  Object.keys(map).sort().forEach(day=>{if(day<tod)map[day].forEach(t=>{if(!STATE.done[t.id])atras.push(t)})});
  if(!atras.length){alert("Não há blocos atrasados. O plano está em dia.");return}
  const manter=[],descartar=[];
  atras.forEach(t=>{
    const ehAula=(t.tp==="aula"||t.tp==="gap"||t.tp==="sim"||t.tp==="esc");
    (soAulas&&!ehAula?descartar:manter).push(t);
  });
  descartar.forEach(t=>{STATE.removed[t.id]=1});
  manter.sort((a,b)=>{
    const ea=(a.tp==="aula"||a.tp==="gap")?0:1, eb=(b.tp==="aula"||b.tp==="gap")?0:1;
    if(ea!==eb)return ea-eb;
    const pa=PESO[a.disc]||9, pb=PESO[b.disc]||9;
    if(pa!==pb)return pa-pb;
    return (a.date||"").localeCompare(b.date||"");
  });
  const ocup={};
  Object.keys(map).forEach(day=>{if(day>=tod)ocup[day]=map[day].filter(t=>!STATE.done[t.id]&&!STATE.removed[t.id]).length});
  let d=tod,alocados=0,sobrou=[];
  manter.forEach(t=>{
    let posto=false;
    let cur=d;
    while(cur<=END){
      const wd=s2d(cur).getDay(),cap=wd===6?0:((TPL[phaseOf(cur)][wd])||[]).length+(wd===0?1:1);
      const n=ocup[cur]||0;
      if(n<cap){
        STATE.moved[t.id]=cur;
        STATE.reTime=STATE.reTime||{};
        STATE.reTime[t.id]=slotTime(cur,n);
        ocup[cur]=n+1;posto=true;alocados++;break;
      }
      cur=addD(cur,1);
    }
    if(!posto)sobrou.push(t);
  });
  sobrou.forEach(t=>{STATE.removed[t.id]=1});
  save();render();
  alert(alocados+" blocos redistribuídos pelos dias que restam."+
    (descartar.length?"\n"+descartar.length+" blocos de questões e revisão atrasados foram descartados.":"")+
    (sobrou.length?"\n"+sobrou.length+" não couberam e saíram do plano.":""));
}
function replanModal(){
  const tod=today(),map=tasksByDay();let n=0,aulas=0;
  Object.keys(map).forEach(day=>{if(day<tod)map[day].forEach(t=>{if(!STATE.done[t.id]){n++;if(t.tp==="aula"||t.tp==="gap"||t.tp==="sim")aulas++}})});
  if(!n){alert("Não há blocos atrasados. O plano está em dia.");return}
  openModal({title:"Replanejar a partir de hoje",
    sub:"Você tem <b>"+n+" blocos atrasados</b>, dos quais <b>"+aulas+" são aulas ou simulados</b>. Eles serão redistribuídos pelos dias que faltam, respeitando o peso de cada matéria — as de maior peso na prova entram primeiro.",
    fields:[{label:"O que fazer com o atraso",type:"select",value:"aulas",
      options:[["aulas","Só aulas e simulados ("+aulas+") — descartar questões e revisões atrasadas"],

}

    ok:"Vincular",extra:cur.url?"Desvincular":null,
    onSave:v=>{const u=safeUrl(v[0]);if(u){STATE.links[k]={url:u,label:v[1].trim(),at:Date.now()};if(STATE.delLinks)delete STATE.delLinks[k]}},onExtra:()=>{dropLink(k)}});
}
function dump(t){const w=window.open("","_blank");if(w)w.document.write("<pre style='font:12px ui-monospace,monospace;white-space:pre-wrap;padding:20px'>"+esc(t)+"</pre>");else alert("Permita pop-ups para exportar.")}
(async function(){await load();if(STATE.view)VIEW=STATE.view;render()})();
</script>
</body>
