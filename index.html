<script>
/* Armazenamento: usa window.storage dentro do Claude, localStorage fora dele. */
(function(){
  if (window.storage && typeof window.storage.get === "function") return;
  var mem={}, has=(function(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}})();
  window.storage={
    get:async k=>{var v=has?localStorage.getItem(k):(k in mem?mem[k]:null);return v==null?null:{key:k,value:v,shared:false}},
    set:async(k,v)=>{has?localStorage.setItem(k,v):mem[k]=v;return{key:k,value:v,shared:false}},
    delete:async k=>{has?localStorage.removeItem(k):delete mem[k];return{key:k,deleted:true,shared:false}},
    list:async p=>{var ks=[];if(has){for(var i=0;i<localStorage.length;i++){var kk=localStorage.key(i);if(!p||kk.indexOf(p)===0)ks.push(kk)}}else{for(var m in mem)if(!p||m.indexOf(p)===0)ks.push(m)}return{keys:ks,prefix:p,shared:false}}
  };
})();
</script>
<style>
:root{
  --ink:#0F1418; --ink-2:#2B343B; --ink-3:#5F6C75; --ink-4:#8C979E;
  --paper:#E9EAE5; --paper-2:#F2F3EF; --surface:#FFFFFF;
  --line:#CFD2CB; --line-soft:#E1E3DD;
  --carmim:#A32B21; --ocre:#9A7A18; --ok:#2E6B4F; --petrol:#1F4E5F;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sh:0 1px 2px rgba(15,20,24,.05),0 4px 16px -6px rgba(15,20,24,.10);
  --max:1080px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:64px}
button,select,input{font-family:inherit}
.boot{padding:56px 24px;font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.inner{max-width:var(--max);margin:0 auto;padding:0 22px}
@media(max-width:520px){.inner{padding:0 14px}}

/* ---------- cabeçalho ---------- */
.hd{background:var(--ink);color:#EDEEEA;padding:30px 0 0;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,var(--carmim) 0 25%,var(--petrol) 25% 50%,var(--ocre) 50% 62%,#3E6B52 62% 100%)}
.hd-grid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:22px}
@media(max-width:640px){.hd-grid{grid-template-columns:1fr;gap:16px}}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#7E8F98;margin-bottom:10px}
.hd h1{margin:0;font-size:clamp(24px,5vw,40px);font-weight:800;letter-spacing:-.035em;text-transform:uppercase;line-height:.96}
.hd h1 em{font-style:normal;color:#7E8F98}
.metrics{display:flex;gap:26px}
@media(max-width:640px){.metrics{gap:20px}}
.metric{font-family:var(--mono);line-height:1}
.metric b{display:block;font-size:clamp(28px,6.5vw,44px);font-weight:700;letter-spacing:-.05em}
.metric i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7E8F98;display:block;margin-top:7px}
.metric.good b{color:#7FBFA0} .metric.mid b{color:#E0B85A} .metric.bad b{color:#E08B7F}

/* ---------- barra das 100 questões ---------- */
.sig{background:#0B0F12;color:#DDE0DC;padding:20px 0 22px}
.sig-lab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6F7D85;margin-bottom:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid100{display:grid;grid-template-columns:repeat(25,1fr);gap:2px}
@media(max-width:640px){.grid100{grid-template-columns:repeat(20,1fr)}}
.q{aspect-ratio:1;border-radius:1px;opacity:.2;transition:opacity .5s ease}
.q.on{opacity:1}
@media(prefers-reduced-motion:reduce){.q{transition:none}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px}
.legend div{font-family:var(--mono);font-size:10px;color:#8B979E;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:1px;display:inline-block;flex:none}

/* ---------- navegação ---------- */
.nav{position:sticky;top:0;z-index:30;background:rgba(233,234,229,.94);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--max);margin:0 auto;padding:0 22px;display:flex;gap:2px;align-items:stretch;overflow-x:auto}
@media(max-width:520px){.nav-in{padding:0 8px}}
.tab{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);padding:14px 14px 12px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--carmim);font-weight:700}
.tab:focus-visible{outline:2px solid var(--petrol);outline-offset:-2px}

.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:14px 0 4px}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);padding:7px 11px;border-radius:3px;cursor:pointer;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--carmim);border-color:var(--carmim);color:#fff}
.btn.pri:hover{background:#8C231A;border-color:#8C231A;color:#fff}
.btn.warn:hover{border-color:var(--carmim);color:var(--carmim)}
.sel{font-family:var(--mono);font-size:11px;padding:7px 8px;border:1px solid var(--line);background:var(--surface);border-radius:3px;color:var(--ink-2)}
.spacer{flex:1}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:4px;box-shadow:var(--sh);padding:18px;margin-top:14px}
.card h3{margin:0 0 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.55}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}

/* hoje */
.today-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{flex:none}
.today-t{flex:1;min-width:180px}
.today-t b{display:block;font-size:15px;letter-spacing:-.01em}
.today-t span{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.next{margin-top:10px;font-size:13px;color:var(--ink-2);border-left:2px solid var(--carmim);padding-left:10px}

/* fases e dias */
.phase{margin:30px 0 10px;padding-bottom:9px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.phase h2{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.13em;font-weight:800}
.phase p{margin:0;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.day{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--line);border-radius:3px;margin-top:8px;box-shadow:var(--sh);transition:border-color .15s}
.day:hover{border-left-color:var(--ink-4)}
.day.today{border-left-color:var(--carmim);box-shadow:0 0 0 1px var(--carmim),var(--sh)}
.day.past{opacity:.55}
.day.exam{border-left-color:var(--ocre);background:#FFFCF3}
.day.full{border-left-color:var(--ok)}
.day-h{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.day-d{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.03em}
.day-w{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3)}
.win{font-family:var(--mono);font-size:10.5px;color:var(--petrol)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;border-radius:2px;color:var(--carmim)}
.day-m{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:8px}
.mini{width:52px;height:4px;background:var(--paper);border-radius:2px;overflow:hidden;display:inline-block}
.mini i{display:block;height:100%;background:var(--ok)}
.day-b{padding:0 14px 12px}

.task{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-soft)}
.task:first-child{border-top:0}
.hora{font-family:var(--mono);font-size:11px;color:var(--ink-4);flex:none;width:42px;padding-top:3px;text-align:right;letter-spacing:-.02em}
.chk{flex:none;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--line);background:var(--surface);border-radius:3px;cursor:pointer;position:relative;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--ink)}
.chk:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk.done::after{content:"";position:absolute;left:5.5px;top:1.5px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.t-body{flex:1;min-width:0}
.t-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#fff;padding:2px 6px;border-radius:2px;white-space:nowrap}
.pass{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.t-title{font-size:13.7px;line-height:1.38}
.task.done .t-title{text-decoration:line-through;color:var(--ink-4)}
.mat{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--petrol);text-decoration:none;border:1px solid var(--line);background:var(--paper-2);padding:3px 7px;border-radius:3px;max-width:100%}
.mat:hover{border-color:var(--petrol)}
.mat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:inline-block;margin-top:6px;margin-left:6px;font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:3px;color:#fff}
.t-act{display:flex;gap:1px;flex:none;opacity:.28;transition:opacity .18s}
.task:hover .t-act,.t-act:focus-within{opacity:1}
@media(hover:none){.t-act{opacity:.7}}
.ico{border:0;background:none;cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding:4px 5px;border-radius:3px;line-height:1}
.ico:hover{background:var(--paper);color:var(--ink)}
.ico.rm:hover{color:var(--carmim)}
.ico:focus-visible{outline:2px solid var(--petrol);outline-offset:1px}
.add{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);background:none;border:1px dashed var(--line);width:100%;padding:7px;margin-top:9px;cursor:pointer;border-radius:3px;letter-spacing:.06em;text-transform:uppercase}
.add:hover{border-color:var(--ink-3);color:var(--ink)}

/* estatística */
.stat{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-family:var(--mono);font-size:11px}
.stat .nm{width:154px;flex:none;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.stat .track{flex:1;height:9px;background:var(--paper);border-radius:2px;overflow:hidden;position:relative}
.stat .fill{height:100%;transition:width .5s ease}
.stat .pc{width:92px;text-align:right;flex:none;color:var(--ink-3)}
@media(max-width:600px){.stat .nm{width:96px;font-size:10px}.stat .pc{width:70px;font-size:10px}}
.rot{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;font-family:var(--mono);font-size:11px}
.rot div{border-left:2px solid var(--line);padding-left:10px}
.rot b{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--ink-4);margin-bottom:3px}

/* materiais */
.mgroup{margin-bottom:20px}
.mgroup h4{margin:0 0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-soft);font-size:13px}
.mrow .mt{flex:1;min-width:0}
.mrow .mu{font-family:var(--mono);font-size:10.5px;color:var(--petrol);word-break:break-all}
.mrow .mu.empty{color:var(--ink-4)}

/* gráfico */
.chart{width:100%;height:auto;display:block}
.axis{font-family:var(--mono);font-size:9px;fill:var(--ink-4)}
.empty{font-family:var(--mono);font-size:11.5px;color:var(--ink-4);padding:22px 0;text-align:center;border:1px dashed var(--line);border-radius:3px}

/* modal */
.mdl{position:fixed;inset:0;z-index:80;background:rgba(15,20,24,.5);display:flex;align-items:center;justify-content:center;padding:18px}
.mdl-c{background:var(--surface);border-radius:5px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 60px -12px rgba(0,0,0,.4);max-height:88vh;overflow:auto}
.mdl-c h4{margin:0 0 4px;font-size:14px;letter-spacing:-.01em}
.mdl-c p.sub{margin:0 0 16px;font-size:12.5px;color:var(--ink-3)}
.fld{margin-bottom:13px}
.fld label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;background:var(--paper-2);color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--petrol);outline-offset:-1px;background:#fff}
.fld .hint{font-size:11.5px;color:var(--ink-4);margin-top:5px}
.mdl-a{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.foot{padding:26px 0 0;font-family:var(--mono);font-size:10.5px;color:var(--ink-4);line-height:1.75}
</style>
</head>

const d2s=d=>d.toISOString().slice(0,10);
const s2d=s=>{const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd,12,0,0)};
const addD=(s,n)=>{const d=s2d(s);d.setDate(d.getDate()+n);return d2s(d)};
const WD=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const fmt=s=>{const d=s2d(s);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")};
function today(){const n=new Date();const t=d2s(new Date(n.getFullYear(),n.getMonth(),n.getDate(),12));return t<START?START:t}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function safeUrl(u){u=String(u||"").trim();return /^(https?:|\.\/|\/|[\w\-.]+\/)/i.test(u)?u:""}

/* ---------- geração ---------- */
function buildQueues(){
  const qs={};
  for(const d in BANK){
    const a=[],maxP=Math.max.apply(null,BANK[d].map(x=>x.p));
    for(let k=1;k<=maxP;k++)BANK[d].forEach(t=>{if(t.p>=k)a.push({id:d+"."+t.id+".p"+k,disc:d,title:t.t,pass:k,min:50})});
    qs[d]=a;
  }
  qs.REV=[];for(let i=0;i<9;i++){const r=REV_CYCLE[i%2];qs.REV.push({id:"REV.c"+i,disc:"REV",title:r.t,pass:1,min:r.min})}
  return qs;
}
function generate(){
  const qs=buildQueues(),plan={},ptr={},dr={};
  for(const k in qs)ptr[k]=0; for(const k in DRILL)dr[k]=0;
  let cur=START;
  while(cur<=PHASE1_END){
    const wd=s2d(cur).getDay(),slots=TEMPLATE[wd],ts=TIMES[wd];plan[cur]=[];
    slots.forEach((d,i)=>{
      if(d==="ERR"){plan[cur].push({id:"E."+cur,disc:"REV",title:"Caderno de erros: registrar e refazer os erros do dia",pass:1,min:30,date:cur,time:ts[i]});return}
      const q=qs[d];
      if(ptr[d]<q.length){const t=q[ptr[d]++];plan[cur].push(Object.assign({},t,{date:cur,time:ts[i]}))}
      else if(DRILL[d]){const n=dr[d]++;plan[cur].push({id:d+".d"+n,disc:d,title:DRILL[d][n%DRILL[d].length],pass:9,min:50,date:cur,time:ts[i]})}
    });
    cur=addD(cur,1);
  }
  for(const day in RETA)plan[day]=RETA[day].map((b,i)=>({id:"F."+day+"."+i,disc:b[0],pass:b[1],title:b[2],min:b[3],time:b[4],date:day}));
  return plan;
}

/* ---------- desempenho ---------- */
function accColor(a){return a>=.75?"#2E6B4F":a>=.6?"#9A7A18":a>=.45?"#B8631F":"#A32B21"}
function discAcc(logs){
  const by={};logs.forEach(l=>{(by[l.disc]=by[l.disc]||[]).push(l)});
  const out={};
  for(const d in by){
    const last=by[d].slice(-4);
    const h=last.reduce((a,l)=>a+l.hit,0),t=last.reduce((a,l)=>a+l.tot,0);
    if(t>0)out[d]={a:h/t,h:h,t:t,n:by[d].length};
  }
  return out;
}
function projected(logs){
  const acc=discAcc(logs);
  const H=logs.reduce((a,l)=>a+l.hit,0),T=logs.reduce((a,l)=>a+l.tot,0);
  const base=T>0?H/T:0;
  let s=0,known=0;
  for(const k in DISC){if(!DISC[k].q)continue;
    if(acc[k]){s+=DISC[k].q*acc[k].a;known+=DISC[k].q}else s+=DISC[k].q*base}
  return{score:s,known:known,geral:base,H:H,T:T,acc:acc};
}
function timeline(){
  const ls=STATE.logs.slice().sort((a,b)=>a.d.localeCompare(b.d));
  const dates=[...new Set(ls.map(l=>l.d))];
  return dates.map(d=>({d:d,v:projected(ls.filter(l=>l.d<=d)).score}));
}

function lineChart(pts){
  if(pts.length<1)return '<div class="empty">Registre ao menos uma bateria de questões para o gráfico aparecer.</div>';
  const W=640,H=210,L=32,R=10,T=14,B=24,iw=W-L-R,ih=H-T-B;
  const n=pts.length,x=i=>L+(n===1?iw/2:iw*i/(n-1)),y=v=>T+ih-(ih*Math.max(0,Math.min(100,v))/100);
  let d="",area="";
  pts.forEach((p,i)=>{d+=(i?" L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)});
  area="M"+x(0).toFixed(1)+" "+(T+ih)+" L"+d.slice(1)+" L"+x(n-1).toFixed(1)+" "+(T+ih)+" Z";
  let g="";[0,25,50,75,100].forEach(v=>{
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(v===50?"#A32B21":"#E1E3DD")+'" stroke-width="1"'+(v===50?' stroke-dasharray="4 3"':'')+'/>';
    g+='<text class="axis" x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>';
  });
  let dots="";pts.forEach((p,i)=>{dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3.2" fill="#0F1418"/>'});
  let lab="";[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i&&v>=0).forEach(i=>{
    lab+='<text class="axis" x="'+x(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+fmt(pts[i].d)+'</text>'});
  const last=pts[pts.length-1].v;
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução da nota projetada">'+g+
   '<path d="'+area+'" fill="rgba(31,78,95,.10)"/><path d="'+d+'" fill="none" stroke="#1F4E5F" stroke-width="2.2" stroke-linejoin="round"/>'+dots+lab+
   '<text class="axis" x="'+(W-R)+'" y="'+(y(last)-9)+'" text-anchor="end" style="fill:#0F1418;font-weight:700">'+last.toFixed(0)+' pts</text></svg>';
}
function ring(pc){
  const r=26,c=2*Math.PI*r;
  return '<svg class="ring" width="66" height="66" viewBox="0 0 66 66" role="img" aria-label="'+pc+'% do dia concluído">'+
   '<circle cx="33" cy="33" r="'+r+'" fill="none" stroke="#E1E3DD" stroke-width="6"/>'+
   '<circle cx="33" cy="33" r="'+r+'" fill="none" stroke="'+(pc>=100?"#2E6B4F":"#A32B21")+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-pc/100)).toFixed(1)+'" transform="rotate(-90 33 33)"/>'+
   '<text x="33" y="37" text-anchor="middle" style="font:700 15px var(--mono);fill:#0F1418">'+pc+'</text></svg>';
}

/* ---------- render ---------- */
function render(){
  const map=tasksByDay(),tod=today(),days=Object.keys(map).sort();
  const dleft=Math.round((s2d(EXAM)-s2d(tod))/864e5);
  let doneAll=0,totAll=0;const per={};
  for(const day in map)map[day].forEach(t=>{
    if(t.disc==="REV")return;
    per[t.disc]=per[t.disc]||{d:0,t:0};per[t.disc].t++;totAll++;
    if(STATE.done[t.id]){per[t.disc].d++;doneAll++}
  });
  const P=projected(STATE.logs);
  const cls=P.T===0?"":(P.score>=70?"good":P.score>=50?"mid":"bad");

  let cells="",legend="";
  for(const k in DISC){if(!DISC[k].q)continue;
    const p=per[k]?per[k].d/Math.max(per[k].t,1):0,f=Math.round(DISC[k].q*p);
    for(let i=0;i<DISC[k].q;i++)cells+='<div class="q'+(i<f?" on":"")+'" style="background:'+DISC[k].c+'"></div>';
    legend+='<div><span class="dot" style="background:'+DISC[k].c+'"></span>'+esc(DISC[k].n)+' · '+DISC[k].q+'q</div>';
  }

  const head='<header class="hd"><div class="inner"><div class="hd-grid"><div>'+
   '<div class="eyebrow">PCPR 2026 · Agente de Polícia Judiciária · banca FGV</div>'+
   '<h1>Plano de ataque<br><em>por peso de prova</em></h1></div>'+
   '<div class="metrics"><div class="metric"><b>'+dleft+'</b><i>dias até 11/10</i></div>'+
   '<div class="metric '+cls+'"><b>'+(P.T?P.score.toFixed(0):"—")+'</b><i>nota projetada /100</i></div>'+
   '<div class="metric"><b>'+Math.round(100*doneAll/Math.max(totAll,1))+'%</b><i>plano cumprido</i></div></div>'+
   '</div></div></header>'+
   '<section class="sig"><div class="inner"><div class="sig-lab"><span>as 100 questões da prova, coloridas por matéria</span><span>'+doneAll+' de '+totAll+' blocos concluídos</span></div>'+
   '<div class="grid100">'+cells+'</div><div class="legend">'+legend+'</div></div></section>'+
   '<nav class="nav"><div class="nav-in" role="tablist">'+
   [["plano","Cronograma"],["desemp","Desempenho"],["mat","Materiais"],["ajuda","Como usar"]].map(t=>
     '<button class="tab" role="tab" aria-selected="'+(TAB===t[0])+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join("")+
   '</div></nav>';

  let main="";
  if(TAB==="plano")main=viewPlano(map,tod,per);
  else if(TAB==="desemp")main=viewDesemp(P);
  else if(TAB==="mat")main=viewMat();
  else main=viewAjuda();

  document.getElementById("root").innerHTML=head+'<main class="inner">'+main+
   '<div class="foot">O tempo segue o número de questões, não a afinidade.<br>'+
   'Tecnologia e Português somam 50 das 100 questões: se o dia apertar, corte o bloco jurídico — nunca o de TI.<br>'+
   'Toda questão errada vira linha no caderno de erros no mesmo dia.</div></main>'+modalHtml();
  bind();
}

function viewPlano(map,tod,per){
  const list=(map[tod]||[]);
  const dn=list.filter(t=>STATE.done[t.id]).length;
  const pc=list.length?Math.round(100*dn/list.length):0;
  const nxt=list.find(t=>!STATE.done[t.id]);
  let html='<div class="card today-card">'+ring(pc)+
   '<div class="today-t"><b>'+WD[s2d(tod).getDay()].replace(/^./,c=>c.toUpperCase())+', '+fmt(tod)+'</b>'+
   '<span>'+dn+' de '+list.length+' blocos · '+(list.reduce((a,t)=>a+t.min,0)/60).toFixed(1).replace(".",",")+'h programadas</span>'+
   (nxt?'<div class="next"><b style="font-weight:600">'+esc(nxt.time||"")+' — '+esc(DISC[nxt.disc].n)+'</b><br>'+esc(nxt.title)+'</div>':'<div class="next" style="border-color:#2E6B4F">Dia concluído. Fecha o caderno de erros e descansa.</div>')+
   '</div></div>';

  html+='<div class="bar"><select class="sel" id="flt"><option value="all">Todas as matérias</option>'+
   Object.keys(DISC).map(k=>'<option value="'+k+'"'+(FILTER===k?" selected":"")+'>'+esc(DISC[k].n)+'</option>').join("")+'</select>'+
   '<button class="btn'+(ONLYOPEN?" on":"")+'" id="oo">Só pendentes</button>'+
   '<button class="btn" id="pull">Puxar atrasados</button>'+
   '<button class="btn" id="jump">Ir para hoje</button><span class="spacer"></span>'+
   '<button class="btn" id="exp">Exportar</button></div>';

  let body="",lastPhase="";
  Object.keys(map).sort().forEach(day=>{
    if(day<START)return;
    const l=map[day].filter(t=>FILTER==="all"||t.disc===FILTER).filter(t=>!ONLYOPEN||!STATE.done[t.id]);
    const phase=day<="2026-09-07"?"F1":(day<="2026-09-29"?"F2":"F3");
    if(phase!==lastPhase){lastPhase=phase;
      const m={F1:["Fase 1 · 10/08 a 07/09 — Construção","Primeira passada nas matérias de maior peso"],
               F2:["Fase 2 · 08/09 a 29/09 — Consolidação","2ª e 3ª passadas + volume de questões"],
               F3:["Fase 3 · 30/09 a 11/10 — Reta final","Só revisão, lei seca e simulado"]}[phase];
      body+='<div class="phase"><h2>'+m[0]+'</h2><p>'+m[1]+'</p></div>';
    }
    if(!l.length&&(FILTER!=="all"||ONLYOPEN))return;
    const mins=l.reduce((a,t)=>a+(t.min||50),0),d2=l.filter(t=>STATE.done[t.id]).length;
    const p2=l.length?Math.round(100*d2/l.length):0;
    const col=STATE.collapsed[day],wd=s2d(day).getDay();
    body+='<div class="day'+(day===tod?" today":"")+(day<tod?" past":"")+(day===EXAM?" exam":"")+(p2===100&&l.length?" full":"")+'">';
    body+='<div class="day-h" data-toggle="'+day+'"><span class="day-d">'+fmt(day)+'</span><span class="day-w">'+WD[wd]+'</span>';
    if(day<=PHASE1_END)body+='<span class="win">'+JANELA[wd]+'</span>';
    if(day===tod)body+='<span class="tag">hoje</span>';
    body+='<span class="day-m"><span class="mini"><i style="width:'+p2+'%"></i></span>'+d2+'/'+l.length+' · '+(mins/60).toFixed(1).replace(".",",")+'h '+(col?"▸":"▾")+'</span></div>';
    if(!col){
      body+='<div class="day-b">';
      l.forEach(t=>{
        const done=!!STATE.done[t.id],lk=STATE.links[matKey(t)];
        const lg=STATE.logs.filter(x=>x.task===t.id);
        body+='<div class="task'+(done?" done":"")+'"><span class="hora">'+(t.time||"")+'</span>';
        body+='<div class="chk'+(done?" done":"")+'" data-done="'+t.id+'" role="checkbox" tabindex="0" aria-checked="'+done+'"></div>';
        body+='<div class="t-body"><div class="t-top"><span class="chip" style="background:'+DISC[t.disc].c+'">'+esc(DISC[t.disc].n)+'</span>';
        body+='<span class="pass">'+esc(PASS[t.pass]||"revisão")+' · '+t.min+' min</span></div>';
        body+='<div class="t-title">'+esc(t.title)+'</div>';
        if(lk&&safeUrl(lk.url))body+='<a class="mat" href="'+esc(safeUrl(lk.url))+'" target="_blank" rel="noopener">📄 <span>'+esc(lk.label||lk.url)+'</span></a>';
        lg.forEach(x=>{const a=x.hit/x.tot;body+='<span class="score" style="background:'+accColor(a)+'">'+x.hit+'/'+x.tot+' · '+Math.round(a*100)+'%</span>'});
        body+='</div>';
        body+='<div class="t-act"><button class="ico" data-log="'+t.id+'" title="Registrar acertos">◎</button>'+
              '<button class="ico" data-link="'+t.id+'" title="Vincular material">📎</button>'+
              '<button class="ico" data-edit="'+t.id+'" title="Editar">✎</button>'+
              '<button class="ico" data-push="'+t.id+'" title="Adiar um dia">→</button>'+
              '<button class="ico rm" data-rm="'+t.id+'" title="Remover">✕</button></div></div>';
      });
      body+='<button class="add" data-add="'+day+'">+ acrescentar bloco neste dia</button></div>';
    }
    body+='</div>';
  });
  return html+body;
}

function viewDesemp(P){
  const tl=timeline();
  let bars="";
  Object.keys(DISC).filter(k=>DISC[k].q).sort((a,b)=>DISC[b].q-DISC[a].q).forEach(k=>{
    const a=P.acc[k];const pc=a?Math.round(a.a*100):0;
    bars+='<div class="stat"><span class="nm"><span class="dot" style="background:'+DISC[k].c+'"></span>'+esc(DISC[k].n)+'</span>'+
     '<span class="track"><span class="fill" style="width:'+pc+'%;background:'+(a?accColor(a.a):"#CFD2CB")+'"></span></span>'+
     '<span class="pc">'+(a?pc+"% · "+a.h+"/"+a.t:"sem dados")+'</span></div>';
  });
  const sims=STATE.logs.filter(l=>l.tot>=80);
  let simHtml=sims.length?sims.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(s=>
    '<div class="stat"><span class="nm">'+fmt(s.d)+'</span><span class="track"><span class="fill" style="width:'+Math.round(100*s.hit/s.tot)+'%;background:'+accColor(s.hit/s.tot)+'"></span></span><span class="pc">'+s.hit+'/'+s.tot+'</span></div>').join("")
    :'<div class="empty">Nenhum simulado registrado ainda. O primeiro está marcado para o domingo 23/08.</div>';

  return '<div class="bar"><button class="btn pri" id="newlog">+ Registrar bateria de questões</button>'+
   '<span class="spacer"></span><button class="btn" id="expLog">Exportar registros</button><button class="btn warn" id="rstLog">Apagar registros</button></div>'+
   '<div class="card"><h3>Nota projetada na prova</h3>'+lineChart(tl)+
   '<p class="note">A projeção multiplica sua taxa de acerto recente em cada matéria (últimas 4 baterias) pelo número de questões que aquela matéria vale na prova, e soma. A linha tracejada vermelha é o corte de 50 pontos. '+
   (P.T?('Base atual: '+P.T+' questões resolvidas, '+Math.round(P.geral*100)+'% de acerto geral. '+(P.known<100?('Matérias ainda sem registro usam a média geral como estimativa — '+(100-P.known)+' das 100 questões estão nessa condição.'):'Todas as matérias já têm registro próprio.')):'Registre suas baterias para a projeção começar a valer.')+'</p></div>'+
   '<div class="cols"><div class="card"><h3>Acerto por matéria</h3>'+bars+
   '<p class="note">Verde acima de 75%, amarelo de 60 a 75%, laranja de 45 a 60%, vermelho abaixo disso. Onde estiver vermelho em matéria de peso alto, é ali que a próxima semana precisa ser reforçada.</p></div>'+
   '<div class="card"><h3>Histórico de simulados</h3>'+simHtml+
   '<p class="note">Conta como simulado toda bateria com 80 questões ou mais.</p></div></div>';
}

/* ---------- eventos ---------- */
function bind(){
  const R=document.getElementById("root"),$=s=>R.querySelector(s),$$=s=>R.querySelectorAll(s);
  $$("[data-tab]").forEach(el=>el.onclick=()=>{TAB=el.dataset.tab;render();window.scrollTo({top:0,behavior:"smooth"})});

  $$("[data-done]").forEach(el=>{
    const f=()=>{const id=el.dataset.done;STATE.done[id]?delete STATE.done[id]:STATE.done[id]=1;save();render()};
    el.onclick=f;el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();f()}};
  });
  $$("[data-toggle]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("button"))return;
    const d=el.dataset.toggle;STATE.collapsed[d]?delete STATE.collapsed[d]:STATE.collapsed[d]=1;save();render();
  });
  $$("[data-edit]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.edit,cur=el.closest(".task").querySelector(".t-title").textContent;
    openModal({title:"Editar bloco",fields:[{label:"Descrição",value:cur}],
      onSave:v=>{if(v[0].trim())STATE.edited[id]=v[0].trim()}});
  });
  $$("[data-rm]").forEach(el=>el.onclick=()=>{STATE.removed[el.dataset.rm]=1;save();render()});
  $$("[data-push]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.push,cur=el.closest(".day").querySelector(".day-h").dataset.toggle;
    STATE.moved[id]=addD(cur,1);save();render();
  });
  $$("[data-log]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.log,row=el.closest(".task");
    const disc=Object.keys(DISC).find(k=>DISC[k].n===row.querySelector(".chip").textContent)||"TI";
    const day=el.closest(".day").querySelector(".day-h").dataset.toggle;
    openModal({title:"Registrar bateria de questões",sub:"Entra no gráfico de desempenho e na nota projetada.",
      fields:[{label:"Matéria",type:"select",value:disc,options:Object.keys(DISC).filter(k=>DISC[k].q).map(k=>[k,DISC[k].n])},
              {label:"Acertos",type:"number",value:"",ph:"22"},
              {label:"Total de questões",type:"number",value:"",ph:"30"},
              {label:"Data",type:"date",value:day}],
      onSave:v=>{const h=+v[1],t=+v[2];if(!(t>0)||!(h>=0)||h>t)return;
        STATE.logs.push({d:v[3]||day,disc:v[0],hit:h,tot:t,task:id})}});
  });
  $$("[data-link]").forEach(el=>el.onclick=()=>{
    const row=el.closest(".task"),id=el.dataset.link;
    const t={id:id};const k=matKey(t),cur=STATE.links[k]||{};
    linkModal(k,cur,row.querySelector(".t-title").textContent);
  });
  $$("[data-linkkey]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.linkkey,cur=STATE.links[k]||{};
    linkModal(k,cur,el.closest(".mrow").querySelector(".mt").childNodes[0].textContent);
  });
  $$("[data-add]").forEach(el=>el.onclick=()=>{
    const day=el.dataset.add;
    openModal({title:"Novo bloco",fields:[
      {label:"O que estudar",value:"",ph:"Ex.: refazer erros de Excel"},
      {label:"Matéria",type:"select",value:"TI",options:Object.keys(DISC).map(k=>[k,DISC[k].n])},
      {label:"Horário",value:"20:30",ph:"20:30"},
      {label:"Duração (min)",type:"number",value:"50"}],
      onSave:v=>{if(!v[0].trim())return;
        STATE.custom[day]=STATE.custom[day]||[];
        STATE.custom[day].push({id:"C."+Date.now(),disc:DISC[v[1]]?v[1]:"REV",pass:1,title:v[0].trim(),min:+v[3]||50,time:v[2]})}});
  });

  if($("#flt"))$("#flt").onchange=e=>{FILTER=e.target.value;render()};
  if($("#oo"))$("#oo").onclick=()=>{ONLYOPEN=!ONLYOPEN;render()};
  if($("#jump"))$("#jump").onclick=()=>{const t=today(),el=[...$$("[data-toggle]")].find(x=>x.dataset.toggle===t);if(el)el.scrollIntoView({behavior:"smooth",block:"center"})};
  if($("#pull"))$("#pull").onclick=()=>{const tod=today(),map=tasksByDay();
    Object.keys(map).forEach(day=>{if(day<tod)map[day].forEach(t=>{if(!STATE.done[t.id])STATE.moved[t.id]=tod})});save();render()};
  if($("#exp"))$("#exp").onclick=()=>{
    const map=tasksByDay();let out="CRONOGRAMA PCPR 2026 — Agente de Polícia Judiciária\n\n";
    Object.keys(map).sort().forEach(d=>{out+=fmt(d)+" ("+WD[s2d(d).getDay()]+")\n";
      map[d].forEach(t=>{const lk=STATE.links[matKey(t)];
        out+="  "+(t.time||"     ")+" ["+(STATE.done[t.id]?"x":" ")+"] "+DISC[t.disc].n+" — "+t.title+" ("+t.min+"min)"+(lk?"\n         material: "+lk.url:"")+"\n"});out+="\n"});
    dump(out);
  };
  if($("#expLog"))$("#expLog").onclick=()=>{
    let o="REGISTROS DE DESEMPENHO — PCPR 2026\n\ndata;materia;acertos;total;percentual\n";
    STATE.logs.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(l=>o+=l.d+";"+DISC[l.disc].n+";"+l.hit+";"+l.tot+";"+Math.round(100*l.hit/l.tot)+"%\n");
    o+="\nJSON completo (para reimportar manualmente):\n"+JSON.stringify(STATE);dump(o);
  };
  if($("#rstLog"))$("#rstLog").onclick=()=>{if(confirm("Apagar todos os registros de desempenho? O cronograma não é afetado."))
    {STATE.logs=[];save();render()}};
  if($("#rst"))$("#rst").onclick=()=>{if(confirm("Isso apaga marcações, edições, links e registros. Continuar?"))
    {STATE={done:{},moved:{},removed:{},edited:{},custom:{},collapsed:{},links:{},logs:[]};save();render()}};

  if(MODAL){
    const c=document.getElementById("mdl");
    const val=()=>[...c.querySelectorAll(".fld input,.fld select")].map(x=>x.value);
    document.getElementById("mdlS").onclick=()=>{MODAL.onSave(val());save();closeModal()};
    document.getElementById("mdlC").onclick=closeModal;
    if(MODAL.extra)document.getElementById("mdlX").onclick=()=>{MODAL.onExtra();save();closeModal()};
    c.onclick=e=>{if(e.target===c)closeModal()};
    document.onkeydown=e=>{if(e.key==="Escape")closeModal()};
  }else document.onkeydown=null;
}
function linkModal(k,cur,titulo){
  openModal({title:"Vincular material",
    sub:"Vale para todas as passadas de: <b>"+esc(String(titulo).slice(0,90))+"</b>",
    fields:[{label:"Endereço do PDF ou da aula",value:cur.url||"",ph:"https://... ou pdfs/ti-seguranca.pdf",
             hint:"Aceita link do Estratégia, do Drive, ou caminho relativo se você guardar os arquivos numa pasta ao lado do index.html."},
            {label:"Nome que aparece no bloco",value:cur.label||"",ph:"Ex.: Aula 03 — Segurança da Informação"}],
    ok:"Vincular",extra:cur.url?"Desvincular":null,
    onSave:v=>{const u=safeUrl(v[0]);if(u)STATE.links[k]={url:u,label:v[1].trim()};},
    onExtra:()=>{delete STATE.links[k]}});
}
function dump(txt){
  const w=window.open("","_blank");
  if(w)w.document.write("<pre style='font:12px ui-monospace,monospace;white-space:pre-wrap;padding:20px'>"+esc(txt)+"</pre>");
  else alert("Permita pop-ups para exportar.");
}
(async function(){await load();render()})();
</script>
